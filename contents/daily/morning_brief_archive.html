    takeaway: "本日(7/16木)は半導体主導のリスクオフで米株が続落して引けた——S&P-0.51%(7,533.8)・Nasdaq-1.47%(25,882)・Dow-0.20%(52,553)。TSMCはQ2でEPS$4.31・売上$40.2B(+33.7%)・粗利率67.7%と好決算だったが、通期設備投資見通しを$52-56B→$60-64Bへ引き上げたことで過剰投資懸念が優勢となり、好決算を相殺してチップ株安を主導。さらにAlphabetが最強AIモデルGemini 3.5 Proの遅延報道で-4%超と下落し、AIバリューチェーン全体のセンチメントが悪化した。個別ではPayPalがStripe+Adventの$53B(1株$60.50・28%プレミアム、コミット融資$50B)TOBで+18%急騰——フィンテック再編とPE大型テイクプライベートの象徴。本日はNFLX(引け後)・UNH・GE・ABT・USB・ISRGの決算ラッシュ。プライベートクレジットはH1'26でCrescent $10.8B・ジュニアデット$50B+目標と記録的調達が続く一方、BDCの与信劣化が併走。日本PEはKKRの太陽HD非公開化やKakaku.com争奪戦(EQT vs Bain+LY)が進み、Goldmanは日本を買収の『early innings』と評価。",
    narrative: "7月16日(木)の市場は、前日のcool CPIがもたらした史上最高値圏の高揚から一転、半導体主導のリスクオフで幕を開けた。震源は米国の対中半導体規制強化を巡る不透明感だ。前日の米チップ株安を受け、東京市場では利益確定売りが噴き出し、日経225は-2.63%の66,960へ急落して67,000を割り込んだ。米株先物もS&P-0.2%・Nasdaq100-0.8%と軟調で、NVIDIA・AMDなどAI半導体に売りが先行している。低インフレという『追い風』が確認された直後だけに、地政学と規制という別種のリスクが相場の主導権を握り直した格好だ。||皮肉なのは、この半導体安が世界最大のファウンドリTSMCの好決算と同じ日に起きたことだ。TSMCはQ2でEPS$4.31(予想比+$0.37)・売上$40.2B(前年比+33.7%)・粗利率67.7%と、AI/HPC需要の底堅さを改めて証明した。それでも株価反応が限定的なのは、市場が『足元の業績』より『対中規制がサプライチェーンとエンド需要をどう変えるか』という先行きの不確実性を重く見ているためだ。ファンダメンタルズとマクロ・地政学が綱引きする、2026年後半らしい構図である。||個別で相場を沸かせたのはPayPalだ。決済大手StripeとPE大手Advent Internationalが共同で$53B(1株$60.50、火曜終値比+28%プレミアム)のTOBを提示し、株価はプレマーケットで+18%急騰した。約$500億のコミット済み銀行融資が付き、事業会社(Stripe)×スポンサー(Advent)が折半保有・解体しない方針だ。これは単なるフィンテック再編にとどまらず、金利が高止まりする環境でも超大型テイクプライベートが成立する『資金の供給力』を象徴する。取締役会は7/20に協議する。||その資金供給力は、プライベートクレジットのファンドレイズ統計にも表れている。H1 2026ではCrescent Capitalが第4号US Direct Lendingで自社最大の$10.8B(目標$2.5B超過)を調達し、Barings($19B/2年)・Churchill($16B)・Antares/Ares(各$8.5B)も続いた。ジュニアデット上位7ファンドは合計$50B超を目標に掲げ、2023-24合計を30%上回る。PayPal級の大型P2Pを支えるシニア+ジュニア+コミット融資の厚みが着実に増している。ただしBDCのノンアクルーアル率上昇や私募BDC解約という与信ストレスは併走しており、『集める力』と『個社の与信劣化』の二極化という基調は変わらない。焦点は調達額から『デプロイの質』へと移りつつある。||日本PEもまた、同じ『事業会社×PE連合』と『競合TOB』のテーマを共有する。KKRは太陽ホールディングスの非公開化に動き、Kakaku.comを巡ってはEQTとBain Capital+LY Corp連合が競合を続ける。Goldman Sachsは日本を買収活動の『early innings』と評し、2025年の案件$33Bは成長余地の入り口に過ぎないと見る。ガバナンス改革・事業承継・カーブアウト・円安という四つの追い風は健在で、メザニン/ジュニア資本の厚みが大型化を後押しする。市場は今日、『AIの構造的成長』と『規制・地政学リスク』の綱引きを映しながら、NetflixやUnitedHealthの決算、そして次のマクロイベントへと視線を移していく。",
    peTraining: {
      thirtySecSummary: "本日のポイントは3点。①対中半導体規制強化への不透明感で半導体主導のリスクオフ——日経-2.63%(66,960)、米先物Nasdaq100-0.8%と史上最高値圏から反落。②TSMCはQ2好決算(EPS$4.31・売上$40.2B・+33.7%・粗利67.7%)も規制懸念で株価反応は限定的、ファンダとマクロ・地政学の綱引き。③PayPalがStripe+Adventの$53B(1株$60.50・28%プレミアム、コミット融資$50B)TOBで+18%急騰——事業会社×PE連合の超大型テイクプライベート。プライベートクレジットはH1'26でCrescent $10.8B・ジュニアデット$50B+と記録的調達が資金供給力を裏付ける。",
      interviewQA: [
        { q: "金利が高止まりする環境で、PayPalのような$53Bの超大型テイクプライベートが成立する背景をどう説明しますか", a: "三つの要素が噛み合っています。第一に、プライベートクレジット/レバレッジドファイナンスの『供給力』が記録的な水準にあること。H1 2026でCrescentが$10.8B、ジュニアデット上位7本が合計$50B超を目標に掲げるなど、シニア+ジュニア+コミット融資の資金が潤沢で、$50B規模のコミット済み銀行融資を組成できる厚みがあります。第二に、事業会社(Stripe)×スポンサー(Advent)という連合により、PEの資本規律・ガバナンスと事業会社のシナジー・戦略的視点を組み合わせ、高いプレミアム(28%)を正当化しやすい構造にしていること。第三に、金利高止まりでもフィンテックのように安定CFと成長を併せ持つ資産は、レバレッジを乗せても十分なエクイティリターンが見込めること。つまり『資金の供給力×連合による価値創出×対象資産の質』が揃えば、高金利下でも大型P2Pは成立するというのが私の見立てです。" },
        { q: "TSMCが好決算にもかかわらず株価が伸び悩んだのはなぜか、投資家としてどう解釈しますか", a: "『良い数字』と『良い株価反応』は別物だという典型例です。TSMCのQ2はEPS$4.31・売上$40.2B(+33.7%)・粗利率67.7%と申し分なく、AI/HPC需要の強さを裏付けました。それでも上値が限定的なのは、市場がすでに好決算を織り込んでいたことに加え、対中半導体規制強化という『将来のキャッシュフローの分母(不確実性)』を大きく見ているためです。バリュエーションは足元の利益ではなく将来CFの割引現在価値で決まりますから、規制でエンド需要やサプライチェーンが変質するリスクが高まれば、目先の増益があっても株価は慎重になります。投資含意は二つ。第一に、地政学・規制リスクは半導体のディスカウントレート(要求リターン)を押し上げる構造的要因として継続監視が必要。第二に、AIインフラ需要そのものは旺盛なので、規制の影響を受けにくいファウンドリ以外のバリューチェーン(電力・データセンター・メモリ・パッケージング)への分散が有効だということです。" },
        { q: "『事業会社×PE連合(Strategic-Sponsor Consortium)』とは何か、なぜ今増えているのか説明してください", a: "事業会社(ストラテジック)とPEファンド(スポンサー)が共同で一つの買収を行う形態です。PayPalのStripe+Advent、日本のKakaku.comを巡るBain+LY Corpが代表例です。増えている理由は三つ。第一に、超大型化する案件の資本負担とリスクを分担できること——単独では重すぎるエクイティを折半できます。第二に、事業会社が持つシナジー(顧客基盤・技術・流通)とPEが持つ資本規律・ガバナンス・EXIT設計を組み合わせ、より高いバリューアップを描けること。これにより競合入札で高いプレミアムを正当化しやすくなります。第三に、規制対応——事業会社が前面に出ることで独禁・安保審査を通しやすくなる、あるいは逆にPEが緩衝材になるケースもあります。投資家としての留意点は、利益相反(事業会社のシナジー取り込みが少数株主やPEのLPと衝突しうる)、ガバナンスの複雑さ、そしてEXIT時の意思決定の齟齬リスクです。連合の『ガバナンス設計』と『出口の合意』が成否を分けます。" }

      keyConceptToday: {

    takeaway: "7/20(月・引けEDT)は寄付きの反発が失速し小幅安で終了——朝方は半導体主導で買い戻されたが、引けにかけラリーがしぼみS&P500-0.19%(7,443)・Nasdaq-0.05%(25,508)・Dow-0.59%(51,839)。MicrosoftのAMDチップ採用でAMDはプレマーケット+4.5%まで買われたが失速、Nvidiaは引けでマイナス圏へ反落しチップのモメンタムが続かなかった。週末に米イランの停戦が崩壊しイランがホルムズ海峡で船舶を拿捕、Brentは$90を突破し引けも$90近辺で高止まり、WTIも~$84.5へ上昇。原油高と地政学懸念が株式のリスクオンを打ち消し、VIXは~21へ上昇。日本は海の日で休場(日経は7/17に-4.03%の64,141)。今週はAlphabet(水引け後)・Tesla・Intel・GM・IBM・GE Vernova・Philip Morrisと決算ラッシュで、capex計画とガイダンスがAI投資サイクル継続の試金石。S&P500は既に86%超が予想超えでQ2増益率は+20%超見込み。プライベート市場では、米はEXIT難でローン期間が4〜5年へ長期化し継続ビークル/ストリップセールが流動性を補完、KKRがアジア$2.5Bをクローズ。日本はM&A$300B(2025)を背景にBlackstoneがプライベートクレジット・ブームへ照準、KKR太陽HD非公開化やKakaku.com争奪戦が続く。",
    narrative: "7月20日の月曜、市場は前週の暗転から明確に反発した。半導体主導で崩れた地合いが、皮肉にも半導体主導で戻り始めたのだ。震源はMicrosoftによるAMDのAIチップ採用報道——AzureのAIインフラにNvidia以外の選択肢を組み込むという判断は、ハイパースケーラーが供給・コストリスクを分散し始めた証左であり、AMDはプレマーケットで+4.5%、Nvidiaも連れ高した。前週にAIトレードのROI懸念で弱気相場入りしたSOX指数に、『需要の裾野拡大』という別角度の追い風が吹き込んだ。S&P500・Nasdaq・Dowは寄付きこそ上昇したが、この反発は続かなかった。引けにかけチップのモメンタムが失速し、イランを巡る地政学懸念と原油続伸が重しとなって、3指数はそろって小幅安(S&P-0.19%・Nasdaq-0.05%・Dow-0.59%)で終えた。朝の楽観は、決算ウィークを前にした慎重さと地政学リスクに押し戻された格好だ。||マクロの主役だった原油と地政学は、緊張を残しつつも小休止した。週末にかけ米イランの停戦は事実上崩壊し、イランはホルムズ海峡を通航する4隻の船舶を拿捕、米はイラン港湾の封鎖を再開した。Brentは月曜に一時$90を突破し7月安値から約+30%まで駆け上がったが、その後$87.7近辺へ反落、WTIも~$82.6へ落ち着いた。原油の一服はインフレ再燃観測と安全資産需要をいったん和らげ、米10年債利回りは~4.55%へ低下、VIXは~20へ鎮静した。ただし供給途絶リスクは消えておらず、エネルギー・インフレ経路のテールリスクは相場の底流に残る。||この日の市場は、ある意味で『息継ぎ』の一日だった。震源に最も近い東京市場は海の日で休場——日経225は7/17に-4.03%の64,141で取引を終えた水準のまま固定され、火曜(7/21)の再開時に月曜の米半導体反発がどこまで波及するかが試金石となる。原油一服と米株高は追い風だが、円の水準と地政学が引き続き振れ幅を規定する。休場という『間』が、投資家に前週の急落を消化し、決算ウィークへ視線を移す猶予を与えた。||そして今週こそがQ2決算の山場だ。Alphabetは水曜引け後に発表し、capex計画がAI投資サイクル継続の是非を映す最重要指標となる。IntelはQ2 EPS $0.22(前年同期は-$0.10の赤字)・売上$14.4B(+11.6%)予想で今週最注目の一つ、Tesla・GM・IBM・GE Vernova・Philip Morrisも並ぶ。S&P500構成企業は既に86%超がコンセンサスを上回り、Q2の前年比増益率は+20%超が見込まれる。だが前週のNetflix急落が示した通り、市場が裁くのは実績よりガイダンス・capex・キャッシュフローだ。良い決算でも先行きが弱ければ売られる——期待値対比のサプライズこそが株価を動かす局面が続く。||プライベート市場では、公開市場の変動をよそに構造的な適応が進む。米プライベートクレジットはPEのEXIT枯渇でローン期間が2〜3年から4〜5年へ長期化し、マルチアセット継続ビークルやストリップセールで成熟・良好ポートフォリオをクリーンアップしてLPへ流動性を還元する動きを強めている。KKRはアジア特化の第2号ファンドを$25億でクローズし、地域供給力を補強した。日本はさらに構造的だ——2025年のM&Aは$300Bへ倍増し過去30年で最も忙しい年となり、Blackstoneが日本のプライベートクレジット・ブームに照準を定め、Glengarryは『今後数四半期で複数の大型案件』を予想する。KKRの太陽HD非公開化、Kakaku.com争奪戦(EQT vs Bain+LY)も続く。公開市場が地政学とAI規律に揺れる裏で、プライベート市場は『出口難への適応』と『日本の構造成長』という二つの静かなテーマを着実に進めている。",
    peTraining: {
      thirtySecSummary: "本日(7/20・引けEDT)のポイントは3点。①米株は寄付きの反発が失速し小幅安——朝方は半導体主導で買われたがラリーが続かずS&P-0.19%・Dow-0.59%。MicrosoftのAMDチップ採用でAMDは一時+4.5%も失速、Nvidiaは引けでマイナスへ反落。②原油・地政学が重し——米イラン停戦崩壊・ホルムズ海峡の船舶拿捕でBrentは$90近辺で高止まり、WTI~$84.5へ続伸、VIX~21へ上昇(東京は海の日で休場)。③今週はAlphabet(水)・Tesla・Intel等の決算ラッシュで、capexとガイダンスがAI投資サイクルの試金石。プライベート市場は米でローン期間の4〜5年化と継続ビークル/ストリップセール、KKRがアジア$2.5Bクローズ、日本はM&A$300BでBlackstoneがプライベートクレジットに照準。",
      interviewQA: [
        { q: "PEの『EXIT枯渇』が長引くと、プライベートクレジットやLPにどんな影響が出ますか。継続ビークルやストリップセールはなぜ増えているのですか", a: "EXIT(売却・IPO)が細ると、PEは保有企業を予定より長く抱え込み、これに紐づくレバレッジドローンの平均期間も2〜3年から4〜5年へ延びます。影響は三層です。第一にLPの流動性——分配(DPI)が遅れ、次のファンドへの再コミットや資金繰りが滞ります。第二にマネジャーの回転——新規ディールが細るとフィー・デプロイが停滞します。第三に与信——保有長期化はレバレッジ返済計画のズレやcovenant余裕度の低下を招きやすい。これを補う手段が、マルチアセット継続ビークル(既存投資家に売却しつつ運用継続)やストリップセール(良好資産の一部持分をセカンダリーで売却)です。狙いは、良い資産を投げ売りせずにLPへ流動性を還元し、ポートフォリオを『クリーンアップ』すること。投資家としての着眼点は、(a)価格の公正性(第三者評価・利益相反の管理)、(b)継続ビークルのGP出資(アラインメント)、(c)売却資産の質(チェリーピックか、劣後資産の押し付けか)、(d)手数料の二重取りの有無、です。出口難の局面ではこうしたセカンダリー技術の巧拙が、マネジャーのリターンとLP信頼を左右します。" },
        { q: "MicrosoftがAMDチップを採用するように、ハイパースケーラーがNvidia依存を薄める動きは、投資家として何を意味しますか", a: "二つの示唆があります。第一に『市場のパイ拡大 vs シェア移動』の切り分けです。ハイパースケーラーがNvidia一強の調達を多様化するのは、供給制約・コスト・交渉力の観点で合理的で、AMDのような第2ソースにシェア獲得の余地が生まれます。ただしこれは必ずしもNvidiaの需要減を意味せず、AIインフラ投資の総量(capex)が拡大している限り、両社が伸びる『パイ拡大』局面もあり得ます。投資家は、シェアの奪い合いなのか市場全体の成長なのかを、各社のガイダンスとハイパースケーラーのcapex計画で見極める必要があります。第二に『垂直統合とバーゲニングパワー』です。顧客が自社ASICや代替GPUを持つほど、GPUベンダーの価格決定力とマージンには上限が意識されます。PE/クレジットの観点では、AIサプライチェーン(電力・冷却・データセンター・光通信・素材)のうち、どこが『複数勝者』で、どこが『勝者総取り』かを見分け、後者に偏らずキャッシュフローの確度が高い『ツルハシ』的資産を選ぶ規律が重要です。今週のAlphabet等のcapexコメントは、この総量とマネタイズを読む最良の材料になります。" },
        { q: "決算ウィークで『実績より、ガイダンス・capex・キャッシュフローを見よ』と言われるのはなぜですか", a: "株式・企業価値は『過去の実績』ではなく『将来キャッシュフローの割引現在価値(DCF)』で決まるからです。四半期の実績は既に株価に相当程度織り込まれており、価値を動かすのは将来CFの見通し=ガイダンスと、それを生む投資=capexです。特にAI関連は、巨額capexが『将来の収益の源泉』なのか『マネタイズ不確実な過剰投資』なのかで評価が真逆になります。前週のNetflixは売上ほぼ一致・EPS小幅ビートでもQ3ガイダンスとFCFの弱さで時間外-8.6%——実績が良くても先行きとキャッシュが弱ければ売られる典型でした。金利上昇局面では割引率が上がり、将来の大きなCFに価値の大半を依存する長デュレーション資産(グロース株)ほどマルチプルが圧縮されます。投資家の実務は、(a)ガイダンスのコンセンサス対比サプライズ、(b)capexの規律とROIC/FCF転換、(c)資本配分(自社株買い・投資バランス)、(d)長デュレーション資産の金利感応度、の4点で企業を裁くこと。『良い決算=株高』ではなく『期待値を超える先行き=株高』だと理解することが肝要です。" }

    narrative: "週末にかけ、中東情勢は新たなエスカレーションの局面を迎えた。イエメンの親イラン武装組織フーシは、サウジアラビア第5位の規模を持つアラムコのジザン製油所を弾道ミサイル3発で攻撃し、複数の煙が施設から立ち上るのが確認された。フーシによるサウジ国内製油所への直接攻撃は約4年ぶりで、これまで続いていた紅海・バブエルマンデブ海峡でのタンカー攻撃や海上封鎖宣言から、サウジ国内インフラへの直接攻撃という新たな段階へエスカレートした形だ。これと並行して米軍は金曜、オマーン湾で対イラン海上封鎖網を少なくとも4回突破しようとしたタンカーを無力化したと発表しており、ホルムズ海峡・紅海双方で供給リスクが同時に高まる複層的な構図となっている。||この地政学リスクの再燃は、来週のFOMC会合(7/28-29)を控えた金利・原油市場の綱引きを一段と複雑にする。原油価格は月内既に30%超上昇しており、Yardeni Researchは中東情勢の不安定化・AI関連の懸念・追加関税観測を注視しつつも、S&P500の年末目標8,250(現水準から約700ポイント上)を維持している。同社は5月半ば以降の『サマー・ストール』を経て、ボラティリティの高い局面から年後半にかけ上昇トレンドへ回帰すると予想するが、週末の製油所攻撃が原油の一段高・インフレ再燃観測を通じて10年債利回り(現在4.71%・2025年1月以来の高水準)にさらなる上昇圧力をかける可能性があり、FOMCのタカ派再評価リスクは残る。||AI関連では、中国のDeepSeekが第2回資金調達(約$15億規模、プレマネー評価額約$710億)を一時停止したと報じられた。背景には、6月に$70億を調達した第1回ラウンドの際、創業者の梁文峰氏がNvidia製チップへの依存や米国に対するAI技術の遅れについて語ったとされる報道が中国メディアで拡散し、本人が不快感を示したことがあるとされる。米中AI競争を巡るナラティブが資金調達の実務にまで波及した格好で、金曜のIntel決算後の設備投資懸念によるAI関連株売り(AMD-3.72%、Nvidia-1.01%)と合わせ、AI投資サイクルを巡る市場の神経質さが浮き彫りになっている。||プライベートクレジット市場では、AIインフラ向け負債の膨張という構造的なテーマが一段と鮮明になった。BlackstoneはAirTrunkが手掛ける400MW超のハイパースケールデータセンター『SYD3』(豪州シドニー)向けに$30億(A$43億)のローン組成を完了、Credit Agricole・DBS・Deutsche Bank・HSBC・ING・三菱UFJ・Morgan Stanley・UOBなど大手行8行超が参加した。AI関連データセンター向け社債・ローンの年初来発行額は$3,345億に達し、2025年通年の$1,855億を既に大きく上回るペースとなっている。上半期のセカンダリー取引過去最高更新($1,210億)、Ping Anの米プライベート市場投資停止、KKRのRoy Gori氏起用、easyJetを巡るApollo対Castlelakeの入札合戦(8/3・8/7回答期限)といった継続テーマと合わせ、プライベートクレジットが金利高止まり環境下でも資金供給機能を拡大し続けている構図が続く。||週明け以降の焦点は、①週末の中東エスカレーション(サウジ製油所攻撃)が月曜の原油・株式市場にどの程度のリスクプレミアムとして織り込まれるか、②来週7/28-29のFOMC会合(据え置き確率97%超が織り込み済みだが原油高によるインフレ再燃観測がタカ派再評価リスクを残す)、③AIデータセンター向け負債の膨張($3,345億)が金利高止まり環境下でのプライベートクレジット市場の脆弱性にどう跳ね返るか、の3点に整理される。日本では円が¥163台の約40年ぶり安値圏で推移する中、月曜の東京市場は週末の中東リスク再燃を受けた半導体関連株(Kioxia・Advantest・東京エレクトロン)の値動きが再び焦点となる可能性が高い。",

        { title:"PIMCO、Oracle/Related DigitalのミシガンAIデータセンター向け$160億調達のうち$100億を引受", tag:"AIデータセンター", tagCls:"t-blue", meta:"PIMCO / Oracle / Related Digital ｜ $16.0B(うちPIMCO $10.0B) ｜ 単一施設向けテック負債で過去最大", body:"ミシガン州セイラン・タウンシップのOracleキャンパス(OpenAIワークロード向け)を支える$140億の社債発行(クーポン7.5%・98.75で価格決定・2045年満期)のうち約$100億をPIMCO運用ファンドが引受。単一施設向けテック負債パッケージとしては過去最大規模とされる。", sig:"プライベートクレジットがハイパースケールAIインフラ投資の中核資金源として存在感を一段と拡大", sourceUrl:"https://www.bloomberg.com/news/articles/2026-07-27/why-pimco-is-betting-billions-on-ai-data-centers-despite-the-risks" },

    jpCredit: {
      summary: "Kakaku.com争奪戦がさらに激化 — EQTが1株¥3,440-3,460(約$21.25)へTOB価格を引き上げ、7/1のBain Capital・LY Corp連合の¥3,384を上回った。Bain・LY連合はさらなる対抗引き上げを検討中と報じられている。KKRによる太陽ホールディングス非公開化は10月上旬のTOB開始に向け順調に進行中(1株¥4,750・約117%プレミアム)。BlackstoneはNippon Lifeと約¥1.5兆(約$94億)規模のプライベートクレジット・パートナーシップを締結、APAC最大級の複数資産クラス提携の一つとなる。",
      deals: [
        { title:"Kakaku.com争奪戦、EQTが¥3,440-3,460へTOB価格引き上げ — Bain・LY連合はさらなる対抗を検討中", tag:"バイアウト", tagCls:"t-purple", meta:"EQT vs Bain Capital+LY Corp ｜ ~¥670B(~$4.1B) ｜ 競合TOB・価格引き上げ合戦", body:"EQTが1株¥3,440-3,460(約$21.25)へ価格を引き上げ、7/1のBain・LY連合の¥3,384を上回った。Bain・LY連合はさらに高い対抗提案を検討中と報じられており、日本の競合TOB案件として過去最大級の価格引き上げ合戦に発展している。", sig:"日本での競合TOBにおける価格引き上げ合戦が新たな常態に", sourceUrl:"https://www.bloomberg.com/news/articles/2026-07-24/bain-and-ly-are-said-to-mull-higher-bid-for-kakaku-rivaling-eqt" },
        { title:"KKR・太陽ホールディングス非公開化、10月上旬のTOB開始に向け順調に進行(継続)", tag:"バイアウト", tagCls:"t-purple", meta:"KKR ｜ ~¥500B(~$3.1-3.2B) ｜ TOB価格¥4,750・約117%プレミアム", body:"KKRの買収ビークルKJ005によるTOBは1株¥4,750(6カ月平均株価に対し約117%プレミアム)で、独禁法・投資規制上の承認待ちを経て10月上旬の開始が見込まれている。", sig:"化学・電子材料セクターでの非公開化トレンドが継続", sourceUrl:"https://www.bloomberg.com/news/articles/2026-04-01/kkr-plans-to-take-japan-s-taiyo-private-in-3-2-billion-deal" },

        { title:"日本向け外資系PEのM&A、上半期は139件・¥3.83兆(前年比+47.3%)で過去最高", tag:"マーケット見通し", tagCls:"t-blue", meta:"市場全体 ｜ 139件・¥3.83T ｜ 前年比+47.3%", body:"海外PEファンドによる日本企業向けM&Aが上半期として過去最高を更新。Goldman Sachsは日本のバイアウト活動について『まだ序盤』との見方を示しており、円安・ガバナンス改革を背景とした構造的な拡大トレンドが続いている。", sig:"外資系PEの日本市場参入は依然として拡大局面の序盤", sourceUrl:"https://finance.biggo.com/news/b9ba1827-edf0-459f-a461-caa18d5fee43" }

      outlook: "💡 Kakaku.com争奪戦は価格引き上げの応酬が続き、日本の競合TOB市場の成熟度を象徴する事例に発展。KKR太陽HD非公開化は10月のTOB開始に向け着実に進行しており、Blackstone・Nippon Lifeの大型提携と合わせ、海外運用会社による日本プライベートクレジット・PE市場への資金流入が加速している構図が鮮明。今週の日銀会合(7/30-31)での成長率見通し・円安への言及が、この資金流入トレンドの持続性を占う材料となる。"

    narrative: "週末にかけて中東情勢は新たな局面を迎えた。ホルムズ海峡を巡る緊張が激化しブレント原油が一時$100を超え年初来+50%まで買われる場面があったが、米国とイランは週末からの軍事攻撃を2日連続で停止。トランプ大統領は停止が『イラン側の要請』によるものだと述べつつ、新たな停戦合意に至らなければ攻撃を再開すると警告しており、協議はイランがホルムズ海峡でのタンカー通航をより自由に認めるかどうかが焦点とされる。この攻撃停止観測を受け、原油は週明けに一日で7%超という急激な反落を見せ、積み上がっていた地政学リスクプレミアムの大半が短期間で剥落する乱高下となった。||この原油急落が株式市場に安心感をもたらす一方、半導体セクターには全く別の材料が重石となった。中国の国家後ろ盾を受けた企業が主要な半導体製造装置の量産を開始したとの報道を受け、米国の製造装置における技術的優位性への競争的脅威が意識され、Nvidia・ASMLは4%超安、AMDは7%安まで売られた。同じタイミングで中国のDRAMメーカーCXMTが上海STAR市場に上場し初日+466%と急騰、約$86億を調達し2026年アジア最大のIPOとして中国上場企業の時価総額トップ(約$4,880億)に躍り出たことも、中国半導体産業の資本市場での存在感拡大を印象づける材料となった。||この結果、米国株式市場は方向感の乱れる展開となった。ダウ平均はApple(+3.5%)などの堅調さと原油安による資金の巻き戻しを支えに+0.36%の52,133.05まで上昇した一方、ナスダックは寄り付き後の上昇分をチップ株安が帳消しにし-0.28%の24,906.95、S&P500も-0.33%の7,387.76と小幅安で推移した。東京市場では日経平均が中東情勢緩和を好感し+0.50%の64,931.19で取引を終え2営業日ぶりに反発したが、Shin-Etsu Chemical(-8.06%)など半導体材料株には中国の製造装置量産報道を受けた売りが波及、上昇率トップのShift Inc(+9.32%)との明暗が分かれた。今週はFOMC(7/29)・日銀会合(7/30-31)に加えQ2GDP速報値・Microsoft/Meta/Amazon/Apple決算が集中する重要週となる。||プライベートクレジット市場では、AIインフラ向け資金供給の規模がさらに一段階拡大した。PIMCOはOracle/Related DigitalのミシガンAIデータセンター(OpenAIワークロード向け)を支える$160億の資金調達のうち$100億を引受、単一施設向けテック負債案件として過去最大規模となった。一方でQ2の米ダイレクトレンディング組成額は前期比▲55%の$335.9億(2023年Q2以来の低水準)に急減しており、メガディールへの資金集中と市場全体の停滞が併存する『二極化』が一段と鮮明になっている。上半期セカンダリー取引の過去最高更新($1,210億)については最終集計でマネジャー主導型が全体の54%を占め4年ぶりにLP主導型を上回ったことが判明、GP主導型セカンダリーの主流化が構造的に定着しつつある様子がうかがえる。||日本では、Kakaku.comを巡る争奪戦がさらに激化した。EQTが1株¥3,440-3,460(約$21.25)へTOB価格を引き上げ、7/1のBain Capital・LY Corp連合の¥3,384を上回り、Bain・LY連合はさらなる対抗引き上げを検討中と報じられている。KKRによる太陽ホールディングス非公開化(1株¥4,750・約117%プレミアム)は10月上旬のTOB開始に向け順調に進行中で、BlackstoneはNippon Lifeと約¥1.5兆(約$94億)規模のプライベートクレジット・パートナーシップを締結、APAC最大級の複数資産クラス提携の一つとなった。海外PEファンドによる日本企業向けM&Aは上半期139件・¥3.83兆(前年比+47.3%)で過去最高を更新しており、Goldman Sachsは『まだ序盤』との見方を示す。今週の日銀会合(7/30-31)での成長率見通し・円安への言及が、この資金流入トレンドの持続性を占う材料として注目される。",
    peTraining: {
      interviewQA: [
        { q: "中国のCXMTが上場初日に+466%も上昇したことは、単なる中国半導体企業の成功物語として片付けてよいものでしょうか、それとも投資家にとってより広い示唆を持つ事象と捉えるべきでしょうか", a: "この事象は二つの異なるレイヤーで解釈する必要があります。第一に、個別銘柄としてのCXMTのIPOポップは、上場初日の需給の歪み(浮動株の少なさ・投機的な資金流入)を反映した側面が大きく、必ずしも企業のファンダメンタルズを正確に織り込んだ株価とは言えません。CXMTのように上場直後に数百パーセント規模で急騰する事例は、その後数週間から数カ月にわたり大きな株価変動(ボラティリティ)を伴うことが多く、短期的な値動きだけで投資判断を下すのは危険です。第二に、より重要なのはマクロ的な示唆です。CXMTが中国上場企業として時価総額トップに躍り出たこと、および同時期に中国の国家後ろ盾企業が半導体製造装置の量産を開始したと報じられたことは、中国の半導体産業(メモリ・製造装置の両面)が技術的キャッチアップを加速させているというシグナルとして市場に受け止められました。投資家としては、①個別企業の株価動向と、②業界構造・地政学的な競争環境の変化、という二つのレイヤーを区別して評価すること、③米中の半導体を巡る技術覇権競争が投資テーマとして一段と重要性を増していること、の3点を意識する必要があります。" },
        { q: "米ダイレクトレンディング市場でQ2の組成額が前期比55%減少した一方、PIMCOがOracle案件で$100億という過去最大級の引受を行うなど、一見矛盾するような動きが同時に起きているのはなぜですか", a: "この現象は『市場の二極化(バーベル化)』として理解するのが適切です。プライベートクレジット市場全体を見ると、AIインフラ・データセンターのような超大型・高格付け・長期契約に裏付けられた案件には、PIMCOのような大手運用会社の資金が引き続き潤沢に流入しています。これはOracleのようなクレジットの信頼性が高い借り手、かつテナント契約(この場合OpenAIのワークロード)に基づく安定的なキャッシュフローが見込める案件であるためです。一方で、中堅・中小企業向けの伝統的なダイレクトレンディング案件は、金利高止まりが長期化する中で借り手側のM&A・LBO活動自体が停滞しており、新規組成の絶対量が細っています。さらに一部のノントレーデッドBDCでは解約(リデンプション)圧力が強まっているとの報告もあり、資金の出し手側にも選別的な姿勢が広がっています。投資家としては、①『プライベートクレジット市場全体が拡大している』という総論だけでなく、案件の格付け・規模・セクターによって資金の流入状況が大きく異なることを認識すること、②メガディールの増加が必ずしも市場全体の健全性を示すものではなく、むしろ質への逃避(フライト・トゥ・クオリティ)が進んでいる兆候である可能性があること、の2点が重要な着眼点です。" },
        { q: "原油価格が週末にかけて一時$100超えまで急騰した後、週明けにわずか1日で7%超急落するという乱高下は、FOMC・日銀という主要中銀の政策判断にとってどのような課題を突きつけますか", a: "中央銀行の金融政策は本質的に『先行きの見通し』に基づいて判断が下されるため、このような短期間での急激な原油価格の変動は政策決定に大きな不確実性をもたらします。具体的には、①データの『ノイズ』と『トレンド』の峻別の難しさ——週末の原油高が一時的な地政学リスクプレミアムなのか、それとも構造的な供給制約を反映した持続的な動きなのかを、会合直前という限られた時間内で見極める必要があること、②フォワードガイダンスの信頼性——中央銀行が仮に原油高を理由にタカ派的なメッセージを発した直後に原油が急落した場合、市場からは政策判断の一貫性を疑われるリスクがあること、③複数のシナリオへの備え——CME FedWatchが示す9月利上げ観測82%という『タカ派的な織り込み』と、原油急落による短期的なインフレ懸念後退という『ハト派材料』が同時に存在する『ねじれ』状態にどう対応するか、という3つの課題が挙げられます。投資家としては、中央銀行の声明文・会見での『どのデータ・期間を重視しているか』という言及に注目し、単発の価格変動に過度に反応しない冷静な政策運営が行われているかを見極めることが重要です。" }
      ],
      keyConceptToday: {
        term: "競合TOB(Bidding War)における価格引き上げ合戦と『独立委員会』の役割",

        { title:"GoldenTree Asset Management、$27.5億のプライベートクレジットファンドIIをハードキャップで組成完了", tag:"資金調達", tagCls:"t-green", meta:"GoldenTree ｜ $2.75B ｜ ハードキャップ・レイテッドフィーダー活用", body:"米欧亜中東の年金・政府系ファンド・保険会社・ファミリーオフィス等から$8億超をレイテッドフィーダー経由で調達するなどオーバーサブスクライブでハードキャップ到達。既に資金の約4割を10業種超・約50件の投資に配分済みで、前身ファンドは純IRR16%・純倍率1.4倍の実績を残している。", sig:"質の高いLP基盤を持つ大手運用会社への資金集中が継続", sourceUrl:"https://www.businesswire.com/news/home/20260720200116/en/GoldenTree-Announces-Closing-of-Oversubscribed-Private-Credit-Fund-II" },
        { title:"米ダイレクトレンディング、Q2組成額が前期比▲40%の$447.6億に急減 — デフォルト率も過去最高水準", tag:"市場動向", tagCls:"t-red", meta:"業界全体 ｜ $44.76B(Q2) ｜ 前期$74.56Bから急減", body:"Q2の米ダイレクトレンディング新規組成額は前期比約40%減の$447.6億に急減。BlackRock・Blackstoneなど大手運用会社では解約請求の増加も報告されており、4月のプライベートクレジット・デフォルト率は過去最高水準の6.0%を記録した。", sig:"メガディールへの資金集中と裾野の停滞・質の劣化懸念が併存する二極化が一段と鮮明に", sourceUrl:"https://www.crowdfundinsider.com/2026/07/289205-us-private-credit-market-closes-q2-quietly-punctuated-by-mega-deal-and-increasing-redemption-pressures/" }

      outlook: "💡 Aresの€30億セカンダリー売却検討とBlackstoneのHSBC豪州ローンポートフォリオ買収は、いずれも『大手運用会社が資産の出し手・受け手として自ら流動性を創出する』という構造変化を象徴する動き。GoldenTreeのハードキャップ達成は質の高いLP基盤を持つ大手への資金集中を裏付ける一方、Q2組成額の急減(▲40%)とデフォルト率の過去最高更新(6.0%)は、メガディールの華やかさの裏で中間・小規模案件の質が劣化している可能性を示唆する。今週のFOMC(7/29)の結果次第でHYスプレッド・資金調達コストへの波及にも注意が必要。",

    jpCredit: {
      summary: "Kakaku.com争奪戦がさらなる展開を見せている — Bain Capital・LY Corp連合がEQTの現行提示価格¥3,450を上回る新たな共同提案を検討中と報じられ、近日中の発表の可能性がある。医薬品卸大手Medipal Holdingsによる子会社PALTACのTOBは7月7日付で成立し出資比率を52.40%→92.64%に引き上げ、スクイーズアウト・上場廃止の手続きへ進む。中堅PEのAdvantage Partnersは6月に組成した日本バイアウトファンドVIII(¥3,000億ハードキャップ)を軸に、政府が経済安全保障上重要とみなす技術を持つ上場企業(時価総額¥3,000億超)への非公開化に照準を定める新戦略を打ち出した。美術品販売のアールビバンもMBO(1株¥1,900・総額最大¥113億)を発表しTOBが8/25まで進行中。KKR太陽ホールディングス非公開化は10月上旬のTOB開始に向け進行に変化なし。",
      deals: [
        { title:"Kakaku.com争奪戦、Bain Capital・LY Corp連合がEQTの¥3,450を上回る新提案を検討中", tag:"バイアウト", tagCls:"t-purple", meta:"Bain Capital+LY Corp vs EQT ｜ ~¥682B(~$4.2B) ｜ 競合TOB・価格引き上げ合戦", body:"Bloombergの報道によると、Bain Capital・LY Corp連合はEQTの現行提示価格¥3,450を上回る新たな共同提案を検討しており、近日中に発表される可能性がある。大株主KDDIが非応募契約に応じれば連合側は¥3,500まで引き上げ余地があるとされ、日本の競合TOB市場で過去最大級の価格引き上げ合戦が続いている。", sig:"日本での競合TOBにおける価格引き上げ合戦がさらに新局面へ", sourceUrl:"https://www.bloomberg.com/news/articles/2026-07-24/bain-and-ly-are-said-to-mull-higher-bid-for-kakaku-rivaling-eqt" },
        { title:"Medipal Holdings、子会社PALTACのTOBが成立 — 出資比率92.64%へ、スクイーズアウトへ", tag:"完全子会社化", tagCls:"t-blue", meta:"Medipal Holdings / PALTAC ｜ ~¥190B ｜ 1株¥6,650・出資比率52.40%→92.64%", body:"医薬品・日用品卸大手Medipal Holdingsは子会社で日用品卸のPALTACに対するTOBを7月7日付で成立させ、出資比率を52.40%から92.64%へ引き上げた。今後スクイーズアウト手続きを経て完全子会社化・東証プライム上場廃止へ進む見通し。", sig:"事業会社による上場子会社の完全子会社化・非公開化トレンドが継続", sourceUrl:"https://nk.jiho.jp/article/303596" },
        { title:"Advantage Partners、『経済安全保障』テーマの非公開化に照準 — ¥3,000億超の上場企業を標的に新戦略", tag:"マーケット見通し", tagCls:"t-blue", meta:"Advantage Partners ｜ Japan Buyout Fund VIII ¥300B(ハードキャップ) ｜ 年4-5件想定", body:"東京拠点のPE大手Advantage Partnersは6月にハードキャップ¥3,000億で組成した日本バイアウトファンドVIIIを軸に、政府が経済安全保障上重要とみなす技術を持つ時価総額¥3,000億($19億)超の上場企業を標的とする新戦略を打ち出した。外資ファンドによる買収に対する『国内の友好的な受け皿』としての位置付けを狙い、年4-5件のペースを想定している。", sig:"経済安全保障を軸とした国内PEによる非公開化という新テーマが台頭", sourceUrl:"https://www.bloomberg.com/news/articles/2026-07-16/japan-pe-fund-seeks-1-9-billion-economic-security-investments" },

      outlook: "💡 Kakaku.com争奪戦はBain・LY連合の新提案検討により決着がさらに持ち越される公算が大きく、日本の競合TOB市場の成熟度を象徴する事例として一段と注目度が高まっている。Advantage Partnersの『経済安全保障』テーマは、外資ファンド主導が目立ってきた日本の非公開化市場に国内PEが独自の切り口で参入する動きとして興味深い。PALTAC・アールビバンのような中規模案件も含め、日本のTOB・非公開化案件は業種・規模を問わず裾野が広がっており、今週の日銀会合(7/30-31)での円安・成長率見通しへの言及が、この資金流入トレンドの持続性を占う材料となる。"

    narrative: "月曜、中東情勢は一時的な緊張緩和の局面を迎えた。米国とイランが軍事攻撃の応酬を停止する方向にあるとの観測が広がり、WTI原油は前日比7.5%安の$82.61、ブレントも8.7%安の$88.36まで急落、いずれも7月中旬以来の安値水準まで反落した。イラン高官はロイターに対し、米国側の攻撃停止が維持される限り自国も応戦を控える意向を伝えたとされる。もっとも、イエメンの親イラン武装組織フーシは週末にサウジのジザン・ヤンブー両製油所への新たな攻撃を主張しておりサウジは代替輸送としてスエズ経由でアジア向けに日量約106万バレルの原油を振り替えるなど、地政学リスクの火種は依然としてくすぶっている。||この原油急落が市場に安心感をもたらす一方、半導体セクターには全く別の激震が走った。中国第4位のDRAMメーカーCXMTが上海STAR市場に上場し初日+466%と急騰、約$98億を調達し時価総額約$4,880億で中国の上場企業として時価総額トップに躍り出た。この記録的なIPOを引き金に、中国発のDRAM・NAND供給拡大がメモリー価格・マージンを押し下げるとの懸念が急速に広がり、SanDiskは約12%安、Micronは約5%安、SK Hynixも約8%安まで売られた。Nvidiaの中国AI半導体シェアがBernstein試算で2024年の66%から2026年には約8%まで低下しHuaweiが約50%を握るとの観測や、中国系企業による半導体製造装置の量産観測も重なり、米中の半導体覇権競争が資本市場に直接波及する一日となった。||この余波は火曜の東京市場を直撃した。日経平均は前日比2,566.27円(-3.95%)安の62,364.92円まで急落、Kioxia Holdingsは一時ストップ安、東京エレクトロン-11%、Advantest-10%、SoftBank Group-5%前後と主力半導体関連株が軒並み売られ、6月の史上最高値からの下落率は約14.5%に達している。米国市場は月曜終値ベースで方向感の乱れる展開となり、S&P500は+0.02%の7,413.18とほぼ横ばい、ダウは原油安を追い風に+0.51%の52,210.08まで上昇した一方、ナスダックはチップ株安を受け-0.18%の24,932.08で引けた。今週は水曜のFOMC(現行3.50-3.75%、据え置きが本線ながらCME FedWatchの利上げ確率が月初のほぼゼロから一時46.5%まで急上昇)、木-金の日銀会合(1.00%据え置き有力・成長率見通し上方修正が焦点)に加え、Microsoft・Meta(水)、Amazon・Apple(木)の決算、Q2GDP速報値も集中する重要週となる。||プライベートクレジット市場では、大手運用会社が資産の『出し手』と『受け手』の双方として流動性創出に動く構図が一段と鮮明になった。Aresは旗艦の欧州ダイレクトレンディングファンド(Ares Capital Europe IV)のLP持分約€30億($34億)を束ねてセカンダリー売却する交渉に入ったと報じられ、実現すれば過去最大級のクレジットセカンダリー案件となる。一方BlackstoneはHSBCの豪州個人向けローンポートフォリオ(A$260-300億規模)の買収で最有力候補とされ、銀行のノンコア資産バルクセールをプライベートクレジットが吸収する構図が拡大している。GoldenTreeは$27.5億のプライベートクレジットファンドIIをハードキャップで組成完了した一方、Q2の米ダイレクトレンディング組成額は前期比約40%減の$447.6億に急減し、4月のデフォルト率は過去最高水準の6.0%を記録するなど、メガディールへの資金集中と裾野の質の劣化が併存する二極化が一段と深まっている。||日本では、Kakaku.comを巡る争奪戦がさらなる展開を見せている。Bain Capital・LY Corp連合はEQTの現行提示価格¥3,450を上回る新たな共同提案を検討していると報じられ、決着はさらに持ち越される公算が大きい。医薬品卸大手Medipal HoldingsによるPALTACのTOBは成立し出資比率を92.64%へ引き上げ、中堅PEのAdvantage Partnersは経済安全保障をテーマとした非公開化という新戦略を打ち出すなど、外資主導が目立っていた日本の非公開化市場に新たな担い手・切り口が広がりつつある。今週の日銀会合(7/30-31)での円安・成長率見通しへの言及が、この資金流入トレンドの持続性を占う材料として注目される。",
    peTraining: {
      interviewQA: [
        { q: "CXMTの上場初日+466%というIPOポップと中国半導体製造装置の量産進展の観測が、なぜ日米韓のチップ関連株全体を巻き込むほどのインパクトを持つのですか", a: "この事象は『個別企業の株価』と『業界構造・地政学的な競争環境の変化』という二つのレイヤーで理解する必要があります。CXMTの上場初日+466%というポップ自体は、浮動株の少なさや投機的資金の流入といった需給の歪みを反映した側面が大きく、必ずしも企業の本源的価値を正確に織り込んだ株価とは言えません。しかし、このIPOが約$4,880億という時価総額で中国の上場企業トップに躍り出たという事実、および同時期に中国系企業が半導体製造装置の量産を進めているとの観測が重なったことは、『中国のメモリー・製造装置産業が技術的キャッチアップを加速させている』という構造的なシグナルとして市場に受け止められました。投資家にとって重要なのは、①メモリー価格・マージンへの直接的な影響(供給拡大による価格下押し観測)と、②製造装置分野における技術的優位性を巡る競争環境の変化という、時間軸の異なる二つのリスクを区別して評価することです。前者は数四半期単位で価格・在庫データに表れる具体的なリスクである一方、後者は米国の輸出規制の実効性や技術移転のスピードに左右される、より不確実性の高い中長期リスクである点に留意が必要です。" },
        { q: "FOMCの利上げ確率が『月初のほぼゼロ→一時46.5%』まで急上昇したことは、据え置きが本線視される会合において投資家にとってどのような意味を持ちますか", a: "中央銀行の政策決定における市場の『織り込み』は、単に最終的な決定内容だけでなく、その決定に至るまでの不確実性の変化自体が重要な情報を持ちます。今回のケースでは、FactSetコンセンサスは一貫して据え置きを本線視していますが、CME FedWatchが示す利上げ確率が短期間でほぼゼロから46.5%まで跳ね上がったという事実は、①直近のインフレ・雇用データが市場の想定よりタカ派的な内容だったこと、②FOMC内部でクック理事・ジェファーソン副議長・ウォーラー理事らからインフレ高止まりへの懸念発言が相次いでいること、③ウォーシュ議長自身が『高止まりするインフレへの忍耐はない』と明言していること、の3点が複合的に作用した結果と考えられます。投資家としては、①会合の『結果』だけでなく、会合直前の織り込みの変化速度・振れ幅自体が当局者間の温度差や経済指標の解釈を巡る不確実性を映す先行指標であること、②仮に据え置きとなった場合でも、声明文・記者会見でのトーンが次回以降の会合に向けたタカ派的な地ならしとなっていないかを注視する必要があること、の2点が実務上のポイントです。" },
        { q: "HSBCが健全な豪州の個人向けローンポートフォリオを丸ごとBlackstoneのようなプライベートクレジット運用会社に売却することは、銀行・プライベートクレジット双方にとってどのような意味を持ちますか", a: "銀行が延滞・不良化した資産ではなく、健全に稼働しているローンポートフォリオを丸ごと売却する『バルクセール』は、主に自己資本比率規制上の資本効率改善と、経営資源を中核事業に集中させる目的で行われます。HSBCのケースでは、Georges Elhedery CEOが進める事業のスリム化戦略の一環として、豪州という非中核市場の個人向け資産を切り離すことで、より高い自己資本利益率(ROE)が見込める事業領域へ資本を再配分できます。一方、Blackstoneのようなプライベートクレジット運用会社にとっては、銀行の厳格な引受審査を経て形成された既存の優良ローンポートフォリオを、相対的に低いコストで一括取得できる魅力的な投資機会となります。銀行と異なり預金保険や自己資本規制の直接的な制約を受けないプライベートクレジット運用会社は、こうした資産をより柔軟な資金調達構造(機関投資家からのファンド資金)で保有・運用できる点が優位性の源泉です。投資家としては、①このような銀行のノンコア資産バルクセールが、プライベートクレジット業界の資産成長の新たな供給源として定着しつつあること、②取得価格が資産の質(延滞率・信用スコア分布)に対して妥当かどうかを見極めるデューデリジェンスの重要性、③銀行規制の強化(バーゼルⅢ最終化等)が今後も同様の資産売却を促す構造的なドライバーであり続ける可能性、の3点を意識する必要があります。" }
      ],
      keyConceptToday: {
        term: "銀行のノンコア資産バルクセール(Loan Portfolio Sale)とプライベートクレジットの受け皿機能",
        definition: "銀行が経営資源を中核事業に集中させるため、非中核市場や非中核事業セグメントで保有する健全なローンポートフォリオ(住宅ローン・クレジットカード債権等)を、プライベートクレジット運用会社などの機関投資家に一括売却する取引。不良債権処理とは異なり、対象資産は延滞していない正常債権であることが多い。",

        { q: "Apolloがeasyジェット買収でCastlelakeとの入札合戦に勝利しましたが、8月7日という『PUSU期限』を迎えるとはどういう意味ですか。なぜこのようなルールが存在するのですか", a: "PUSU(Put Up or Shut Up)は英国テイクオーバーコード(買収法)に定められた規則で、買収に関心を示した企業が一定期間内に正式な買収オファーを発表するか、買収を断念する旨を公表するかを迫られる制度です。今回のケースでは、Apolloが7月8日に1株£7.15の対抗オファーを提示しeasyJet取締役会がCastlelakeの£6.90を上回るApollo案での合意に達したことを7月10日に公表したことで、このPUSU期限のカウントダウンが開始し、8月7日午後5時が期限となります。この制度が存在する理由は、買収観測が長期化すると対象企業の株価が不安定な状態(『バーチャル買収』状態)が続き、経営の意思決定や従業員・取引先との関係に悪影響を及ぼすためです。期限までに正式オファーが発表されなければ、原則としてその当事者は一定期間(通常6か月)再度の買収提案を行うことができなくなります。投資家・PEプロフェッショナルにとっては、①PUSU期限が近づくにつれて対象企業株価のボラティリティが高まりやすいこと、②期限内に資金調達(デットファイナンス含む)を完了させる必要があるためLBOの実行可能性を見極める重要な材料になること、の2点が実務上のポイントです。" }

    peTraining: {
      interviewQA: [
        { q: "同じ木曜引け後決算で、AmazonとAppleがそれぞれ+12%・-7%という対照的な株価反応となりました。両社ともコンセンサス自体は概ね達成していたとされる中、なぜこれほど評価が分かれたのでしょうか", a: "この現象は、決算評価の軸が『実績数値のビート・ミス』から『将来の構造的成長ドライバーの有無』へ完全にシフトしていることを示しています。Amazonの場合、AWSの成長率が18四半期ぶりの高水準まで加速したことに加え、AI・カスタムチップ事業の急速な拡大という『新たな成長エンジン』が明確に確認できたため、投資家は将来の収益成長軌道が上方修正されると評価しました。一方Appleは、iPhone17需要やサービス収益といった既存事業こそ堅調だったものの、AI関連の具体的な新規収益ドライバー(例えば独自のAI半導体・クラウドサービスの急拡大など)を示すことができず、Amazonのような『AI時代における新たな成長の物語』を提示できなかったことが失望売りにつながりました。投資家として重要なのは、決算のヘッドライン数値だけでなく、経営陣が示す次世代の成長ドライバーの具体性・説得力を比較評価することです。特に同業他社が同時に決算を発表する局面では、相対的な『AI戦略のストーリーの強さ』が株価反応を左右する重要な変数となります。" },
        { q: "日銀が1.00%据え置きを8対1で決定したにもかかわらず、市場はこれを『タカ派的』と受け止めました。据え置き決定がなぜハト派的ではなくタカ派的と解釈されたのですか", a: "この解釈の鍵は、決定そのものではなく『反対票の方向性』と『声明文言のトーン』にあります。据え置きという決定自体は市場予想通りでしたが、唯一の反対票を投じた高田創審議委員は、より緩和的な政策(据え置きよりもハト派的な選択肢)を求めたのではなく、逆に1.25%への『利上げ』を主張しました。据え置きが本線視された会合で『利上げ方向』の反対意見が出ること自体が、政策委員会内でインフレへの警戒感が高まっている証左と受け止められます。さらに声明文では、コアインフレ率が2026年度下期にかけて『2%を明確に上回る』水準まで加速するとの見通しが示され、賃上げの価格転嫁・原油高・円安進行が要因として挙げられました。これは日銀が物価上振れリスクをより重く見ていることを意味し、次回以降の会合での追加利上げ確率を市場が引き上げる材料となります。投資家は、政策決定の結果だけでなく、投票内訳・反対意見の方向性・声明文のインフレ見通しの変化という『付随情報』を通じて、将来の政策経路に対するシグナルを読み取る必要があります。" },
        { q: "Micron・キオクシア・アドバンテスト・東京エレクトロンなど、半導体・メモリー関連株が同時に急伸した木曜-金曜の値動きから、AI投資サイクルを巡る懐疑論と強気論の対立をどう理解すればよいですか", a: "この値動きは、AI投資サイクルへの評価が『ムード(雰囲気)』によって短期間で大きく振れやすいという市場の性質を象徴しています。わずか数営業日前まで、半導体・AI関連株はAI設備投資の循環性(circularity)や採算性への懐疑論を背景に4営業日連続安となるなど弱気相場に近い展開でした。しかし、サムスン電子のQ2決算がDRAM・NAND需要の底堅さと2028年までの需給逼迫継続見通しを確認したことをきっかけに、投資家の見方は一気に『AIメモリー不足』という強気の物語へ転換し、Micron・キオクシア・東京エレクトロン・アドバンテストが軒並み急伸しました。このような値動きから得られる教訓は、①AI投資サイクルの評価は需要側(メモリー・データセンター需要)と供給側(生産能力・在庫水準)の両方のデータを継続的に確認する必要があること、②単一企業(この場合サムスン電子)の決算コメントが業界全体のセンチメントを一変させるほどの影響力を持つこと、③短期的な株価の乱高下に惑わされず、AIインフラ投資の実需(実際の売上・受注・稼働率)を示す一次データを重視することが重要だという点です。" }
      ],
      keyConceptToday: {
        term: "レートチェック(Rate Check)と協調介入 — 通貨当局による為替介入の実務プロセス",
        definition: "『レートチェック』とは、通貨当局(財務省・中央銀行)が為替ディーラーに対し現在の為替レートを問い合わせる行為で、実際の介入(市場でのドル売り・円買いなど)に先立つ『前兆』として市場関係者に広く認識されている。木曜夜、日本の当局とみられる介入観測に加え、米当局が日本側にレートチェックを行ったとも報じられており、これは日米が協調して介入の可能性を検討している、あるいは日本の一方的な介入を米国が容認する姿勢を示すシグナルとして市場に受け止められた。",

    peTraining: {
      interviewQA: [
        { q: "日本単独ではなく『日米協調』での為替介入が今回実施されたことが強調されています。単独介入と協調介入では、市場への影響やその持続性にどのような違いがあるのでしょうか", a: "単独介入と協調介入の最大の違いは、市場参加者に対する『シグナルの強度』にあります。日本単独の介入は、日本当局が保有する外貨準備という限られた資金力の範囲内での市場操作にとどまり、根本的な金利差(この場合は日米金利差)が是正されない限り、投機筋は時間の経過とともに再び円売りポジションを積み増す傾向があります。実際、2026年に入ってからの日本単独介入は過去に一時的な効果にとどまってきました。一方、米国が関与する協調介入は、米財務省が自国のドル高是正にも利害が一致していることを示唆し、介入余力・政策的コミットメントの両面で市場に強いメッセージを送ります。投資家として重要なのは、介入の『規模』だけでなく『関与国の数と組み合わせ』を見ることです。協調の度合いが高いほど、投機的な逆張りポジションの構築コストが上がり、トレンドの反転がより持続的なものになりやすいと評価されます。ただし、根本的な金利差という構造的要因が解消されない限り、協調介入も時間を稼ぐ対症療法にとどまるリスクは残ります。" },
        { q: "トランプ大統領のイラン攻撃見送りの表明を受け、株式市場は好感して上昇した一方、10年債利回りも同時に低下しました。地政学リスクの後退が『株高』と『金利低下』という一見矛盾するようにも見える反応を同時にもたらすのはなぜですか", a: "この現象は、地政学リスクが資産価格に与える影響が『複数の経路』を通じて働くことを理解すると整合的に説明できます。地政学リスクの上昇は、①原油供給懸念によるインフレ圧力の上昇(金利上昇要因)と、②将来の経済活動・企業収益への不確実性の高まり(株安要因)という2つの経路を同時に持っています。したがって地政学リスクが後退すると、①原油価格の下落を通じたインフレ懸念の後退(金利低下要因)と、②不確実性の低下による企業収益見通しの改善(株高要因)が同時に発生し、株高と金利低下が『矛盾』ではなく『同じ根本原因から生じる整合的な反応』として観察されるのです。投資家にとっての実務的な教訓は、地政学リスクを評価する際に、原油・コモディティ市場への影響(インフレ経路)と、実体経済・企業収益への影響(成長経路)を分けて考え、両方の経路が同じ方向に動いているか、逆方向に綱引きしているかを常に点検することです。今回のケースは両経路が同じ方向(リスク後退)に動いた典型例といえます。" },
        { q: "PrysmianによるAtkore買収は7月31日終値に対し約30%のプレミアムが提示されました。M&A案件における買収プレミアムの水準は何によって決まり、投資家はこれをどう評価すべきですか", a: "買収プレミアムの水準は、主に①対象企業の戦略的希少性(買収者にとって代替が効かない資産かどうか)、②競合入札の有無、③対象企業の直近株価が本源的価値に対して割安に放置されていたかどうか、という3つの要因で決まります。Atkoreの場合、Prysmianにとって北米の電気製品事業展開を一挙に拡大できる希少な資産であったこと、そして単独交渉による買収(競合入札がない状態)であったことを踏まえると、30%というプレミアムは業界内の類似の非競合型M&A案件と比較して妥当な水準と評価できます。投資家がこうした買収発表に接した際に確認すべきは、①プレミアムの絶対水準だけでなく類似取引との相対比較、②買収資金の調達方法(今回は負債・ハイブリッド債・自己株式処分の組み合わせで、Prysmianの投資適格格付け維持を意識した設計)、③規制当局の承認見通しとクロージングまでの期間、の3点です。特に③については、案件発表から成立までの期間中に対象企業株価が買収価格に収斂していく過程(ディールスプレッドの縮小)を観察することで、市場が案件成立の確度をどう評価しているかを読み取ることができます。" }

    narrative: "月曜のウォール街は大幅続伸で取引を終えた。トランプ大統領がイランへの追加攻撃を見送り交渉再開を示唆したことを受け地政学リスクが後退、WTI原油が一時9%超急落したことを好感し、ダウは終値ベースで史上最高値を更新する693.38ドル高(+1.32%)、S&P500は+1.48%、ナスダックは+2.1%とそれぞれ大幅高となった。火曜の寄り前はこの勢いを引き継ぎ、CaterpillarとPalantirの好決算が市場心理をさらに押し上げている。||CaterpillarはQ2売上高が四半期として過去最高の$20.5B(前年比+24%)に達しデータセンター向け発電機器の受注残高も過去最高を更新、Palantirは8四半期連続の予想超えとなる決算と通期ガイダンスの上方修正を発表し、いずれも寄り前に二桁の上昇となった。引け後にはAMDが市場予想売上高$11.3Bで決算を発表するほか、6月に史上最大規模の$85.7BでIPOしたSpaceXが上場後初の四半期決算を発表する。IPO価格$135から45%超下落した株価にとって、AI(xAI)事業の資金消費ペースが最大の注目点となる。||東京市場では前日の日米協調とみられる介入の余韻が残る中、ドル円は¥156台から¥157.8近辺まで戻したものの、追加介入への警戒感から上値は重い展開。日経平均はAI・半導体関連の押し目買いに支えられ前日比+202.63円(+0.32%)の63,957.53円で続伸した。||プライベートエクイティ・M&A市場では、easyJet争奪戦がApolloの1株£7.15への引き上げでCastlelake(£6.90)を突き放す展開となり、取締役会もCastlelake案の推奨に消極的な姿勢を見せるなど決着に向けた動きが加速。日本ではJPMC(3276)がサンライズキャピタル傘下SPCによるMBOを発表し本日TOBを開始したほか、ジェイ・エス・ビーのウォーバーグ・ピンカスによるTOBは8月3日に決済が開始され非公開化完了に向かっている。一方カカクコム争奪戦はEQTが期限を8月17日へ再延長し、Bain・LY連合も¥3,520へ引き上げるなど、日本最大級の競合TOBはさらなる延長戦に突入した。||プライベートクレジット市場では、ハイパースケーラー各社のAI向け社債発行が2026年通期で$250-300B規模に達する見通しとなる中、TeraWulfがAnthropic向けケンタッキー州キャンパス建設に追加$3.5B規模の資金調達を計画するなど、AIインフラ向け資金需要の拡大に衰えは見えない。今週はJOLTS求人件数・ADP雇用統計・ISM非製造業を経て金曜のNFP雇用統計まで重要指標が続き、9月FOMCの利下げ確率を巡る綱引きに決着をつける一週間となる。",
    peTraining: {
      interviewQA: [
        { q: "JPMCのMBOでは前日終値に対し23.5%のプレミアムが提示された一方、ジェイ・エス・ビーのTOBでは28.57%のプレミアムでした。MBO(経営陣主導の買収)とPEファンド主導の買収とで、提示されるプレミアム水準に構造的な違いは生じるのでしょうか", a: "理論的には、MBOはPEファンド主導の買収と比べてプレミアムがやや低めになる傾向があります。その背景には利益相反の構造があります。MBOでは経営陣自身が買い手側に回るため、既存株主に対して『安く買いたい』経営陣と『高く売りたい』株主との間に利害の対立が生じやすく、独立委員会による第三者算定機関を用いたフェアネス・オピニオンの取得や、他の買い手候補による対抗提案の機会(マーケット・チェック)を確保することが、株主保護の観点から一段と重要になります。一方でPEファンド主導の買収(ジェイ・エス・ビーのようなケース)では、既存経営陣は買い手と直接の資本関係を持たないため、より純粋な市場価格形成のメカニズムが働きやすく、結果としてプレミアムが相対的に高くなる傾向があります。投資家として重要なのは、プレミアムの絶対水準だけでなく、独立委員会の設置有無・算定機関の独立性・マーケットチェック期間の長さといった『プロセスの公正性』を示す情報開示を確認することです。" },
        { q: "easyJet争奪戦ではApolloが£7.15、Castlelakeが£6.90という僅差の入札合戦が続いています。競合入札(コンペティティブ・ビディング)において、最終的な決め手はプレミアム額だけではないとよく言われますが、実際には何が重要になるのでしょうか", a: "競合入札における決め手は、①提示価格そのもの、②資金調達の確実性(financing certainty)、③クロージングまでのスピードと規制承認の確度、④対象企業の取締役会・従業員・既存株主との関係性、の4点に集約されます。今回のケースでApolloがCastlelakeよりわずかに高い£7.15を提示しただけでなく、easyJet取締役会がApollo案との『原則合意』に達しCastlelake案の推奨に消極的な姿勢を見せている背景には、価格差以上に資金調達の確実性やディール実行の速さが評価された可能性があります。一般に、プライベートエクイティの入札合戦では『全額確定した資金調達(fully committed financing)』を提示できるかどうかが、僅差の価格競争において最終的な決め手になることが多く、投資家はプレスリリースにおける資金調達方法の記載(エクイティ・コミットメント・レター、デットコミットメントの有無)を必ず確認すべきです。" },
        { q: "本日はCaterpillarとPalantirが『ビート・アンド・レイズ(実績が予想を上回り、かつ通期ガイダンスも同時に引き上げる)』決算を発表し株価が二桁上昇しました。単なる『予想超え』と『ビート・アンド・レイズ』とで、株価反応にどのような違いが生じるのか説明してください", a: "単なる『予想超え(ビート)』は、その四半期の実績が市場予想を上回ったという『過去の結果』に関する情報にとどまりますが、『ビート・アンド・レイズ』は同時に経営陣が『将来の見通し』についても自信を強めたことを意味するため、株価への影響がより持続的かつ大きくなる傾向があります。これは、株式のバリュエーションが本質的に将来キャッシュフローの割引現在価値によって決まるためで、通期ガイダンスの上方修正はアナリストによる将来収益モデルの上方修正(エスティメート・リビジョン)に直結し、目標株価の引き上げを通じて株価反応が増幅されます。逆に『予想は上回ったがガイダンスは据え置き、または引き下げ』という場合(いわゆる『ビート・アンド・ミス』)は、決算発表直後に株価が下落することも珍しくありません。投資家が決算を評価する際は、当該四半期の実績だけでなく、経営陣が示すガイダンスの方向性・その裏付けとなる受注残高や需要動向のコメントまで含めて総合的に判断する必要があります。" }

      keyConceptToday: {

        definition: "ビート・アンド・レイズとは、企業が四半期決算において市場予想を上回る実績(ビート)を計上すると同時に、通期などの将来ガイダンスも上方修正(レイズ)することを指す。本日のCaterpillar(Q2売上高$20.5B・過去最高)とPalantir(8四半期連続の予想超え・通期ガイダンス上方修正)はいずれもこのパターンに該当し、寄り前にそれぞれ二桁の株価上昇となった。",
        background: "2026年のAI関連設備投資ブームを背景に、データセンター向け発電機器を手掛けるCaterpillarや、AI分析ソフトウェアを提供するPalantirといった『AIインフラの周辺需要』を取り込む企業への業績期待が高まっている。両社とも単月・単四半期の好調さにとどまらず、受注残高やパイプラインの強さを示す指標を同時に開示したことが、投資家の確信度を高める材料となった。",

        context2026: "2026年はAIインフラ投資の裾野が半導体・データセンター運営会社にとどまらず、発電設備(Caterpillar)・分析ソフトウェア(Palantir)・素材や電力網といった周辺産業にまで広がっている年であり、こうした『AI恩恵の第二波』企業のビート・アンド・レイズ決算が相次ぐことは、AI投資ブームの実体経済への浸透度合いを測る重要な指標となっている。もっとも一部ではAIデータセンター向け資金調達の急拡大に対する過熱感も指摘されており、決算の『質』を見極める重要性は増している。"

    narrative: "8/3に実施された日米協調為替介入により、ドル円は¥163.99から¥157.16まで6.83円という大幅な変動を記録した。40年ぶりの円安水準が一時的に反転したことで、8/5の東京市場では輸出関連・円安メリット株(トヨタ自動車、三菱商事など)に利益確定売りが優勢となり、Nikkei 225も反落した。介入効果がどこまで持続するかは早くも疑問視されており、市場は神経質な展開が続いている。||同時に、米・イラン間でホルムズ海峡再開に向けた合意が近いとの報道が原油市場を大きく動かした。米財務長官ベッセント氏は『数時間以内に合意できる可能性がある』と発言し、Brent原油は6%超下落して$79を割り込んだ。ただしイラン外務省は米側の海上封鎖解除が前提との立場を崩しておらず、交渉の不透明感は残る。原油急落はインフレ期待の後退につながり、9月FOMCでの利下げ観測を後押しする材料として市場に受け止められている。||米国株式市場は、ドル円の急変動・原油急落という2つの大きな材料が交錯する中、S&P500・Nasdaq・Dowともに小幅安で取引を終えた。8/7発表予定の7月雇用統計を控え、市場全体としては次の材料待ちの神経質な地合いが続いている。||プライベートクレジット市場では、Ares Managementが医療サービス企業買収向けに$22億のダイレクトローンを組成し、記録的な解約局面を経てもなお大型優良案件への資金供給力が健在であることを示した。一方でJane Streetの$110億債務再編、Bridgepointのセカンダリー売却検討など、既存ポジションの整理・再編に関する報道も相次いでおり、市場は『強者への資金集中』と『既存ポジションの整理』が同時進行する選別的な局面に入っている。||日本市場では、円の急変動が海外勢による日本企業買収の割安感にどう影響するかが注視されているが、$300B規模の日本M&A拡大という構造的なテーマ自体への影響は限定的との見方が優勢。Kakaku.com争奪戦などの継続中の競合TOBの動向が引き続き焦点となる。",

      interviewQA: [
        { q: "日米協調為替介入とは何ですか、なぜ市場に大きな影響を与えるのですか", a: "協調介入とは、複数国の通貨当局(この場合は米財務省・日銀)が合意の上で同時に外国為替市場に介入し、特定方向への通貨変動を抑制・反転させようとする政策措置です。単独介入と比べ、①介入規模自体が大きくなり得ること、②『主要国が協調している』というメッセージ性が市場参加者の期待形成に強く働くこと、の2点で影響力が大きくなります。今回のケースでは40年ぶりの円安水準という『行き過ぎ』への対応と位置付けられ、ドル円が短時間で6.83円動くという異例の規模の変動につながりました。投資家としては、介入は為替トレンドを『反転』させるとは限らず、あくまで行き過ぎの一時的な修正である場合が多いため、介入後も中長期的なファンダメンタルズ(日米金利差など)がトレンドの方向性を最終的に規定する点を踏まえる必要があります。" },
        { q: "原油価格の急落が『利下げ観測を後押しする』とはどういうメカニズムですか", a: "原油はエネルギーコストとして広範な財・サービスの価格に影響するため、原油価格の変動はインフレ率(特にヘッドラインCPI)に直接的な影響を与えます。原油価格が下落すればガソリン代・輸送コスト等が下がり、インフレ率の上昇圧力が緩和されます。中央銀行(FRB)はインフレと雇用のバランスを見て金利政策を決定するため、インフレ圧力が後退すれば、雇用維持を重視した利下げの余地が広がると市場は解釈します。ただし、今回のケースは地政学リスク(ホルムズ海峡)に起因する一時的な価格変動である可能性が高く、交渉が不透明なままエスカレーションに転じれば原油価格は再上昇し、インフレ再燃・利下げ観測後退へと反転するリスクも同時に存在する点に留意が必要です。" },
        { q: "『記録的な解約局面を経てもなお大型優良案件への資金供給力は健在』という評価は、プライベートクレジット業界のどのような構造を示していますか", a: "プライベートクレジット業界では今年、ファンド解約(リデンプション)が記録的な規模に達し、業界全体の資金調達環境が厳しくなっているとされていました。そうした逆風の中でもAresのような大手運用会社が$22億規模の大型シンジケートローンを組成できたという事実は、業界内での『質による選別』が進んでいることを示します。つまり、資金は業界全体に均等に行き渡るのではなく、信用力の高い借り手・実績のある運用会社に集中する『強者集中』の構造が強まっているということです。投資家としては、業界全体のマクロ的な逆風(解約増加)と、個別の優良案件・大手プレイヤーのパフォーマンスを分けて評価する視点が重要になります。" }

function fmtNum(v){
  if (typeof v !== 'number') return v;
  return v.toLocaleString('en-US', { maximumFractionDigits: 1 });
}
function dirClass(dir){ return dir === 'up' ? 'up' : dir === 'down' ? 'down' : 'flat'; }
function cClass(dir){ return dir==='up'?'c-up':dir==='down'?'c-down':'c-flat'; }
function macroValClass(dir){ return dir==='up'?'up':dir==='down'?'down':''; }
function arrow(dir){ return dir==='up'?'▲':dir==='down'?'▼':'‒'; }

function newsLink(item, isDeal){
  if(!item) return '';
  let url = item.sourceUrl;
  let label = '記事を読む →';
  if(!url && item.searchKey){
    url = 'https://www.google.com/search?q=' + encodeURIComponent(item.searchKey);
    label = '関連ニュースを見る';
  }
  if(!url) return '';
  const a = '<a class="' + (isDeal ? 'deal-link' : 'ev-link') + '" href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
  return isDeal ? '<div class="deal-links">' + a + '</div>' : a;
}

function sparkline(key){
  const end = currentIdx;
  const start = Math.max(0, end - 4); // last 5 trading days incl. today
  const pts = [];
  for(let i = start; i <= end; i++){
    const idx = MARKET_REPORTS[i] && MARKET_REPORTS[i].indices && MARKET_REPORTS[i].indices[key];
    if(idx && typeof idx.value === 'number') pts.push(idx.value);
  }
  if(pts.length < 2) return '';
  const w = 88, h = 26, pad = 3;
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (pts.length - 1);
  const coords = pts.map(function(v, i){
    return [pad + i * stepX, pad + (h - pad * 2) * (1 - (v - min) / range)];
  });
  const path = coords.map(function(c, i){ return (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
  const last = coords[coords.length - 1];
  const dotColor = pts[pts.length - 1] >= pts[0] ? '#10b981' : '#ef4444';
  return '<svg class="idx-spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
    '<path d="' + path + '" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="' + dotColor + '"/>' +
  '</svg>';
}

function renderIdxCard(idx, key){
  if(!idx) return '';
  const chg = (typeof idx.change === 'number') ? (idx.change>=0?'+':'') + fmtNum(idx.change) : idx.change;
  const pct = (typeof idx.pct === 'number') ? (idx.pct>=0?'+':'') + idx.pct.toFixed(2) + '%' : idx.pct;
  return '<div class="idx-card ' + dirClass(idx.dir) + '">' +
    '<div class="idx-name">' + idx.flag + ' ' + idx.name + '</div>' +
    '<div class="idx-val">' + fmtNum(idx.value) + '</div>' +
    '<div class="idx-chg ' + cClass(idx.dir) + '">' + arrow(idx.dir) + ' ' + chg + ' (' + pct + ')</div>' +
    sparkline(key) +
  '</div>';
}

function renderMacro(macro){
  if(!macro) return '';
  return Object.keys(macro).map(function(k){
    const v = macro[k];
    return '<div class="macro-item"><span class="macro-lbl">' + k + '</span>' +
      '<span class="macro-val ' + macroValClass(v.dir) + '">' + arrow(v.dir) + ' ' + v.value + '</span></div>';
  }).join('');
}

function moverRow(m){
  return '<div class="mover-row">' +
    '<div class="mover-ticker">' + m.ticker + '</div>' +
    '<div class="mover-info"><div class="mover-name">' + m.name + '</div><div class="mover-why">' + m.why + '</div></div>' +
    '<div class="mover-pct ' + m.dir + '">' + (m.pct>=0?'+':'') + m.pct.toFixed(1) + '%</div>' +
  '</div>';
}
function renderMoversLayout(movers){
  movers = movers || [];
  const ups = movers.filter(function(m){ return m.dir === 'up'; });
  const downs = movers.filter(function(m){ return m.dir === 'down'; });
  const upsHtml = ups.length ? ups.map(moverRow).join('') : '<div style="font-size:12px;color:#94a3b8">上昇銘柄なし</div>';
  const downsHtml = downs.length ? downs.map(moverRow).join('') : '<div style="font-size:12px;color:#94a3b8">下落銘柄なし</div>';
  return '<div>' + upsHtml + '</div><div>' + downsHtml + '</div>';
}

function renderEvents(events){
  events = events || [];
  if(!events.length) return '<div style="font-size:12px;color:#94a3b8">本日のイベントなし</div>';
  return events.map(function(e){
    return '<div class="ev-item"><div class="ev-title">' + e.icon + ' ' + e.title + '</div>' +
      '<div class="ev-detail">' + e.detail + '</div>' +
      newsLink(e, false) + '</div>';
  }).join('');
}

function renderDeal(d){
  return '<div class="deal">' +
    '<span class="deal-tag ' + d.tagCls + '">' + d.tag + '</span>' +
    '<div class="deal-ttl">' + d.title + '</div>' +
    '<div class="deal-meta">' + d.meta + '</div>' +
    '<div class="deal-body">' + d.body + '</div>' +
    '<div class="deal-sig">' + d.sig + '</div>' +
    newsLink(d, true) +
  '</div>';
}
function renderCreditBox(boxCls, flag, name, sub, data){
  if(!data) return '';
  const deals = data.deals || [];
  return '<div class="pc-box ' + boxCls + '">' +
    '<div class="pc-hdr"><span class="pc-flag">' + flag + '</span><span class="pc-name">' + name + '</span></div>' +
    '<div class="pc-sub">' + sub + '</div>' +
    '<div class="pc-summary">' + (data.summary || '') + '</div>' +
    '<div class="deals-grid">' + deals.map(renderDeal).join('') + '</div>' +
    '<div class="pc-outlook">' + (data.outlook || '') + '</div>' +
  '</div>';
}

function renderRateWatch(data){
  if(!data) return '';
  const items = data.items || [];
  const itemsHtml = items.map(function(it){
    return '<div class="ev-item"><div class="ev-title">' + it.icon + ' ' + it.title + '</div>' +
      '<div class="ev-detail">' + it.detail + '</div>' + newsLink(it, false) + '</div>';
  }).join('');
  return '<div class="pc-box rw-box">' +
    '<div class="pc-hdr"><span class="pc-flag">🏦</span><span class="pc-name">日米金利動向</span></div>' +
    '<div class="pc-sub">CPI・FRB・日銀・金利見通し</div>' +
    '<div class="pc-summary">' + (data.summary || '') + '</div>' +
    '<div class="events-list">' + itemsHtml + '</div>' +
    '<div class="pc-outlook">' + (data.outlook || '') + '</div>' +
  '</div>';
}

function renderNarrative(str){
  if(!str) return '<p style="color:#94a3b8">本日はナラティブ未生成</p>';
  return str.split('||').map(function(p){ return '<p>' + p.trim() + '</p>'; }).join('');
}

function renderPeTraining(pt){
  if(!pt) return '<div style="font-size:12px;color:#94a3b8">本日のPEトレーニングコンテンツなし</div>';
  const qaHtml = (pt.interviewQA || []).map(function(qa){
    return '<div class="qa-item"><div class="qa-q">' + qa.q + '</div><div class="qa-a">' + qa.a + '</div></div>';
  }).join('');
  const kc = pt.keyConceptToday || {};
  const da = pt.dealAnalysis || {};
  return '' +
    '<div class="pet-grid">' +
      '<div class="pet-card"><div class="pet-card-hdr">面接想定Q&amp;A</div>' + qaHtml + '</div>' +
      '<div class="pet-card"><div class="pet-card-hdr">今日の重要概念：' + (kc.term || '') + '</div>' +
        '<div class="concept-items">' +
          '<div class="concept-item"><div class="concept-lbl">定義</div><div class="concept-val">' + (kc.definition || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">背景</div><div class="concept-val">' + (kc.background || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">実務での使われ方</div><div class="concept-val">' + (kc.practical || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">2026年の文脈</div><div class="concept-val">' + (kc.context2026 || '') + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="pet-card" style="grid-column:1/-1"><div class="pet-card-hdr">ディール分析：' + (da.title || '') + '</div>' +
        '<div class="da-items">' +
          '<div class="da-item thesis"><div class="da-lbl">投資テーマ</div><div class="da-val">' + (da.thesis || '') + '</div></div>' +
          '<div class="da-item timing"><div class="da-lbl">なぜ今か</div><div class="da-val">' + (da.timing || '') + '</div></div>' +
          '<div class="da-item downside"><div class="da-lbl">ダウンサイド</div><div class="da-val">' + (da.downside || '') + '</div></div>' +
          '<div class="da-item valuation"><div class="da-lbl">バリュエーション</div><div class="da-val">' + (da.valuation || '') + '</div></div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

let currentIdx = MARKET_REPORTS.length - 1;

function dowLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return ['日','月','火','水','木','金','土'][d.getDay()];
}

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = MARKET_REPORTS.map(function(r, i){
    return '<button class="tab-btn' + (i === currentIdx ? ' active' : '') + '" data-idx="' + i + '">' +
      r.dateLabel + '<span class="dow">' + dowLabel(r.date) + '</span></button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('.tab-btn'), function(btn){
    btn.addEventListener('click', function(){
      currentIdx = parseInt(btn.getAttribute('data-idx'), 10);
      renderAll();
    });
  });
}

function renderPanel(r){
  const idxCards = ['sp500','nasdaq','dow','nikkei'].map(function(k){ return renderIdxCard(r.indices[k], k); }).join('');
  return '' +
  '<div class="section"><div class="idx-grid">' + idxCards + '</div></div>' +
  '<div class="section"><div class="card"><div class="card-title">🌐 マクロ指標</div><div class="macro-grid">' + renderMacro(r.macro) + '</div></div></div>' +
  '<div class="section"><div class="sec-title">値動き銘柄</div>' +
    '<div class="movers-card"><div class="movers-layout">' + renderMoversLayout(r.movers) + '</div></div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">本日の注目イベント</div>' +
    '<div class="events-list">' + renderEvents(r.events) + '</div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">🏦 日米金利動向</div>' + renderRateWatch(r.rateWatch) + '</div>' +
  '<div class="section"><div class="sec-title">🇺🇸 US Private Credit</div>' +
    renderCreditBox('us-box', '🇺🇸', 'US Private Credit', 'ダイレクトレンディング・プライベートクレジット', r.usCredit) +
  '</div>' +
  '<div class="section"><div class="sec-title">🇯🇵 Japan PE / Private Credit</div>' +
    renderCreditBox('jp-box', '🇯🇵', 'Japan PE / Private Credit', 'バイアウト・TOB・メザニン', r.jpCredit) +
  '</div>' +
  '<div class="section"><div class="sec-title">本日のナラティブ</div>' +
    '<div class="narrative-box">' + renderNarrative(r.narrative) + '</div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">PEトレーニング</div>' + renderPeTraining(r.peTraining) + '</div>';
}

function renderAll(){
  renderTabs();
  const r = MARKET_REPORTS[currentIdx];
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="report-panel active">' + renderPanel(r) + '</div>';
  const tokenInfo = document.getElementById('token-info');
  if(tokenInfo){
    const total = MARKET_REPORTS.reduce(function(s, x){ return s + (x.tokenEstimate || 0); }, 0);
    tokenInfo.textContent = '本日のトークン概算: ' + (r.tokenEstimate || 0).toLocaleString() + ' ｜ 累計: ' + total.toLocaleString();
  }
  document.title = '🇺🇸 US Market Morning Brief (' + r.dateLabel + ') | Private Credit Focus';
  const nav2 = document.getElementById('tab-nav-inner');
  const activeBtn = nav2.querySelector('.tab-btn.active');
  if(activeBtn && activeBtn.scrollIntoView){ activeBtn.scrollIntoView({ inline: 'center', block: 'nearest' }); }
}

renderAll();
</script>
</body>
</html>
