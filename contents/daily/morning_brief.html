      outlook: "💡 ダイレクトレンディングの資金調達鈍化とSRT市場の拡大は、プライベートクレジット業界全体の『重心』が伝統的な企業向け直接融資から、銀行規制資本効率化やデータセンター向けIG与信など多様な戦略へ移行しつつあることを示す。一方でSophosの事例は、AIによる技術的陳腐化リスクをプライベートクレジット勢がどう与信審査に織り込むかという未成熟な論点を浮き彫りにしており、業界の『量の分散』と『質の選別』が同時進行する構図が続く。"

    narrative: "8/22(土・EDT)、米国市場は週末で休場が続く中、最大の材料はホルムズ海峡での緊張再燃だった。48時間で3件目となるADNOC関連タンカーへの攻撃が土曜未明に発生し、UAE外務省はイラン革命防衛隊(IRGC)の『海賊行為』を改めて非難する声明を発表、イラン側も攻撃への関与を公式に認めており、原油市場の地政学リスクプレミアムは高止まりが続く見通し。||来週最大の注目イベントは8/27-29開催のジャクソンホール会議、とりわけ8/28に予定されるウォーシュ議長の就任後初講演。ファンドマネージャーの69%は『中立的』なトーンを予想する一方、TD Securitiesはインフレ抑制への信認を再構築する重要な機会になるとみており、9/16FOMCを3週間後に控える中、同講演が数少ない政策の手がかりとして市場の最大の関心を集めている。10年債利回りは4.73%、30年債利回りも約20年ぶり高水準で高止まりが続いており、直近週は国債市場の乱高下が株式市場のボラティリティを高める場面もあった。||週末最大の話題は暗号資産市場の続伸で、ビットコインは金曜+7.26%の$78,335で引け週間+22%と2024年以来最強の週間パフォーマンスを記録、週末にかけ$78,000台を維持している。現物ビットコインETFには木曜だけで$6.06億の資金が流入(5月以来最大)しBlackRockが83%を占めるなど、規制環境の好転期待とドル安を背景に強気地合いが継続。来週8/26にはNvidiaが決算発表を控えており、売上高$930-950億(前年比+67~75%)という高いハードルを乗り越えられるかが次の焦点となる。||プライベートクレジット市場では、Apolloが『ダイレクトレンディングは業界全体のごく一部』との見方を改めて強調する一方、非上場BDCの2Q資金調達額は前年比▲82%の$20億まで急減し解約請求額は過去最高の$230億に達するなど、業界の構造転換が一段と鮮明になった。対照的にManulife CQSは銀行規制資本の効率化需要を追い風にSRT(証券化リスク移転)第4号ファンドで約$10億・目標IRR約13%の調達に着手。一方、Thoma Bravo傘下Sophosの借換えはAIによるサイバーセキュリティ業界破壊への懸念からプライベートクレジット勢が及び腰となり、既存のシンジケートローン市場への回帰を迫られており、業界の『量の分散』と『質の選別』が同時進行する構図が浮き彫りとなった。||日本市場では、Kakaku.com争奪戦において株価がEQT(¥3,570)・Bain/LY連合(¥3,640)いずれの提示価格も上回る¥3,710台で推移する異例の状態が続く。大株主Oasis Managementは一段の価格引き上げを要求しており、8/27のTOB期限まで1週間を切る中、決着に向けた最終盤の駆け引きが最大の焦点。中堅ではMCJ・Japan Property Management CenterのMBO案件も並行して進行しており、日本のテイクプライベート市場は大型競合TOBの最終盤と中型MBOの拡大が同時に進む状況が続いている。",
    peTraining: {
      interviewQA: [
        { q: "SRT(Significant Risk Transfer、証券化による信用リスク移転)とは何ですか。銀行がこれを活用する経済的合理性を説明してください", a: "SRTとは、銀行が保有するコーポレートローン等のポートフォリオについて、その信用リスクの一部を証券化商品(通常はメザニン層のトランシェ)としてプライベートクレジット投資家等に移転する取引です。銀行はバーゼル規制等の自己資本規制上、保有する貸出資産のリスクに応じた自己資本の積み立てが求められますが、SRTによりリスクの一部を外部投資家に移転することで、規制上の自己資本要件を軽減し、その分の資本を新規貸出や株主還元に再配分できます。投資家側からは、銀行の融資ポートフォリオという伝統的にアクセスしにくかった資産クラスへのエクスポージャーを、比較的高いリターン(今回のケースでは目標IRR約13%)で獲得できる機会となります。銀行の自己資本効率化ニーズと、利回りを求める投資家のニーズが合致することで、SRT市場は近年急速に拡大しています。" },
        { q: "Thoma Bravo傘下のSophosが、当初検討していたプライベートクレジットでの借換えを断念し、既存のシンジケートローン投資家に回帰したのはなぜですか。この事例から何を学ぶべきですか", a: "プライベートクレジット投資家は、伝統的な銀行融資と異なり自らバランスシート上でリスクを長期保有するため、与信審査において借り手の将来キャッシュフローの持続可能性をより深く精査する傾向があります。Sophosのケースでは、AI技術の進展がサイバーセキュリティという事業領域そのものを『コモディティ化』させ、既存の製品・サービスの競争優位性を将来的に毀損しうるという構造的リスクへの懸念から、プライベートクレジット投資家が及び腰になったとみられます。結果としてSophosは、より高いクーポン・追加の元本償却・厳格な財務制限条項という『借り手に不利な条件』を提示してでも、既存のシンジケートローン投資家に回帰せざるを得ませんでした。この事例は、①同じ借り手であっても資金調達チャネルによって与信審査の視点が異なりうること、②AIのような破壊的技術トレンドが、業界特性次第では『追い風』ではなく『与信上の懸念材料』として評価されうること、を示す重要な先例です。" },
        { q: "FRB議長がジャクソンホール会議で明確なフォワードガイダンスを避ける方針を示している場合でも、市場がその講演を『次回FOMCの手がかり』として重視するのはなぜですか", a: "中央銀行総裁の発言は、明示的な政策予告(フォワードガイダンス)がなくとも、①インフレや雇用情勢に対する『トーン』(タカ派的か・ハト派的か)、②過去の発言と比較した『変化の方向性』、③特定のリスク要因への言及の有無、といった間接的な情報を市場に提供します。ウォーシュ議長のように意図的にフォワードガイダンスを避ける場合でも、講演の言葉選びや強調点の変化から、市場参加者は次回会合での政策変更確率を再評価します。特に今回のように、講演がFOMC会合の約3週間前という『会合ブラックアウト期間直前』のタイミングで行われる場合、それが公式な会合前に得られる『最後のまとまった手がかり』となるため、市場のボラティリティを高めやすい重要イベントとして扱われます。" }

        { title:"Eagle Point Credit、Anthropicを主要テナントとするテキサス州AIデータセンターに$13億のメザニン融資 — 総額$160億のプロジェクトファイナンスの一部", tag:"デジタルインフラ融資", tagCls:"t-blue", meta:"Eagle Point Credit / Nexus Data Centers ｜ $1.3B(メザニン) ｜ 総額$16Bパッケージ", body:"開発会社Nexus Data Centersがテキサス州ハバード(ダラス南方約70マイル)で進める2,900エーカーのAIデータセンター建設向け。自家発電用のガス火力発電所を併設し、Anthropicが主要テナントとなる。$13億部分は最も安全なトランシェの下位に位置するメザニンデットとして組成され、直近クローズした。Nexusにとって初の開発案件でありながら、全米で進行中の数十のデータセンターキャンパスの中でも最大級の規模となる。", sig:"AIインフラ向けメザニン需要がプライベートクレジットの新たな収益源に", sourceUrl:"https://finance.yahoo.com/technology/ai/articles/eagle-point-backs-1-3b-195252331.html" },
        { title:"BCRED・Blue Owl Technology Financeが投資適格債を相次いで増額発行 — 3Q入り後のBDC債需要を試す最初のテストに", tag:"資金調達", tagCls:"t-green", meta:"Blackstone BCRED $750M(当初約$500M)/ Blue Owl Tech Finance $400M(当初$200M超)", body:"BCREDは5年債の発行額を当初想定の約$5億から$7.5億へ増額し、ピーク時の応募額は約$20億に達した。Blue Owl Technology Financeも当初$2億以上の想定に対し$4億をプライシングし、応募はピークで約$10.5億。3Q初のBDC債発行としては初の本格的な需要テストとなり、旺盛な投資家需要が8月の投資適格債発行額を過去最高水準に押し上げる一因となった。", sig:"解約圧力下でも大手BDCのホールセール調達力は健在", sourceUrl:"https://finance.yahoo.com/markets/stocks/articles/blackstone-blue-owl-funds-upsize-bond-sales-195930611.html" },
        { title:"ノントレーデッドBDCの募集額が2Qに$20億へ急減(前年同期比▲82%) — ダイレクトレンディングの縮小で業界は資産担保型へ大きくピボット", tag:"マーケット動向", tagCls:"t-red", meta:"業界全体 ｜ 非上場BDC募集額 $2.0B(前年同期$11B) ｜ 資金フロー", body:"Apollo Global Managementの分析によれば、ノントレーデッドBDCの資金調達額は2Qに前年同期の$110億から$20億へ82%減少した。リテール資金の流入が急減する中、運用会社は伝統的な企業向けダイレクトレンディングから、資産担保型融資(ABF)・インフラクレジットなど新たなリターン源へと軸足を移しつつある。ダイレクトレンディングのスプレッドはBDC中央値でレバレッジドローン対比100bps未満まで圧縮しており(2017-18年は300bps超)、収益性の観点からもピボットが不可避となっている。", sig:"『リテール資金頼み』のビジネスモデルが転換点に", sourceUrl:"https://www.bloomberg.com/news/articles/2026-08-20/private-credit-makes-a-big-pivot-as-direct-lending-funds-shrink" }
      ],
      outlook: "💡 業界は明確に二層化しつつある。AIデータセンターのようにリスク・リターンが説明しやすく規模も大きい案件には資金が集中し(Eagle Point案件、Metaの$290億JV)、大手BDCのホールセール債務調達も投資家需要が旺盛。一方で中堅企業向けの伝統的ダイレクトレンディングは、スプレッド圧縮(対レバレッジドローン100bps未満)とリテール資金の急減(ノントレーデッドBDC募集額▲82%)というダブルパンチに直面している。運用会社が資産担保型融資へピボットする動きは合理的だが、それは同時に『各社が慣れていない資産クラスでの与信判断』が今後数年の業界パフォーマンスを規定することも意味しており、この移行期の与信品質こそが最大の注視点となる。"
    },
    jpCredit: {
      summary: "Kakaku.com争奪戦は8/27のTOB期限を目前に、物言う株主Oasis Managementが『¥3,640未満では応募しない』と明言したことで最終盤の緊張が高まっている。中堅ではベインキャピタルと組んだボードルア(4413)のMBOが8/19に開始されたが、TOBプレミアムがわずか0.95%と極めて低く、少数株主保護の観点から論点を残す。2026年上期のPEファンド関与の国内M&Aは約4.2兆円と前年同期比約4割増となっており、案件の量的拡大が続く一方で、価格算定プロセスの妥当性という質的論点が並行して顕在化している。",
      deals: [
        { title:"Kakaku.com争奪戦、Oasis Managementが『¥3,640未満では応募せず』と表明 — 8/27のTOB期限直前で最終局面へ", tag:"バイアウト", tagCls:"t-purple", meta:"EQT ¥3,570 vs Oasis要求水準 ¥3,640 ｜ 期限8/27 ｜ ネット", body:"Oasis ManagementとベインキャピタルのTOB受け皿会社との応募契約は8/20に失効。Oasisは、EQTコンソーシアムの¥3,570のTOBについても、¥3,640まで引き上げられない限り応募しない方針を明言した。デジタルガレージとKDDIは応募せずスクイーズアウト後の自己株買いを選択し、デジタルガレージは売却代金の一部を買収主体の親会社への出資に再投資する計画とされる。取締役会はEQT案を支持しているが、Oasisの明示的な水準提示は最終盤の価格形成に直接影響する。", sig:"アクティビストによる『応募水準の明示』が日本の競合TOBの新たな価格発見装置に", sourceUrl:"https://finance.yahoo.com/markets/stocks/articles/oasis-does-not-support-tender-000000671.html" },
        { title:"ボードルア(4413)、ベインキャピタルと組んだMBOで非公開化へ — TOB価格¥2,970、プレミアムはわずか0.95%", tag:"MBO", tagCls:"t-green", meta:"ボードルア ｜ ¥2,970/株 ｜ BCPE Neon Cayman(ベインキャピタル) ｜ 買付総額最大447.48億円", body:"ITインフラサービスのボードルアが8/19にMBOを発表。買付期間は8/19〜10/5の31営業日、決済開始は10/13、公開買付代理人は野村證券。買付予定数1,506万6,853株に対し下限は所有割合9.55%相当の313万5,200株。TOB価格¥2,970は前営業日終値¥2,942に対しわずか0.95%のプレミアムにとどまり、株価が既にMBO観測を織り込んで4日続伸していた点を含め、価格の妥当性が論点となりうる。成立すれば東証プライムから上場廃止。", sig:"MBO観測先行による『プレミアムほぼゼロ』案件は少数株主保護の論点を残す", sourceUrl:"https://maonline.jp/news/20260819a" },
        { title:"2026年上期のPEファンド関与の国内M&Aは約4.2兆円、前年同期比約4割増 — 過当競争の芽も", tag:"マーケット動向", tagCls:"t-orange", meta:"日本市場全体 ｜ 上期約4.2兆円(前年同期比+約40%) ｜ 統計", body:"日本経済新聞の集計によれば、2026年上期にPEファンドが関与した国内M&Aは約4.2兆円と前年同期から約4割増加した。東証によるPBR改革・政策保有株の縮減、事業ポートフォリオ見直しの加速がファンドの案件供給を支える一方、有力案件への資金集中による買収価格の高騰・過当競争の兆しも指摘されている。金利上昇局面ではLBOの調達コストも切り上がるため、高値掴みのリスクは相応に高まる。", sig:"案件量の拡大とリターン期待の低下がトレードオフに", sourceUrl:"https://www.nikkei.com/article/DGXZQOUB0383D0T00C26A8000000/" }
      ],
      outlook: "💡 Kakaku.comは8/27の期限までにEQTが¥3,640へ再引き上げするか、Oasis等の非応募を織り込んだうえで¥3,570のまま成立を目指すかの二者択一に追い込まれつつある。日本のテイクプライベート市場では、ボードルアのようにMBO観測が株価に先行して織り込まれ実質プレミアムがほぼ消える案件も出ており、『TOBプレミアム水準』だけでは価格の妥当性を測れない局面が増えている。上期の案件量が前年比4割増という活況の裏側で、日銀の利上げによるLBO調達コスト上昇が加われば、ファンド側の投資規律がこれまで以上に試される。"
    },
    narrative: "火曜(8/25・EDT)の米国市場は寄付き前段階で反発してのスタート。前日は半導体株の急落に押されS&P500が-0.28%の7,652.86、Nasdaqが-0.76%の25,980.19と下落した一方、Dowは+0.26%の53,417.16と逆行高となる分裂した相場だったが、火曜の先物はS&P500が+0.39%、Nasdaq100が+0.80%、Dowが+0.43%と揃って上昇。国債利回りが2営業日続けて低下したことが支援材料となり、前日売られた半導体株には買い戻しが入っている。||最大の個別材料はDick's Sporting Goodsの決算で、2Q調整後EPS $3.53(予想$3.78)・売上$55.9億(予想$56.5億)と揃って未達となったうえ、通期調整後EPS見通しを$11.00〜12.00(市場予想$14.20)へ大幅に引き下げた。中核のDICK'S事業の既存店売上は+4.9%と堅調だったものの、買収したFoot Lockerのプロフォーマ既存店の弱さと利益希薄化が重荷となり、株価は寄り付き前に15%安。スタック会長が『アスレチックフットウェア・アパレル市場の一部で販促色が一段と強まった』と述べたことで、Nike・Academy Sportsにも売りが波及した。||今週の主役は依然としてNvidiaで、8/26(水)引け後の2Q決算に向け株価は月曜まで7営業日続落(累計-7.5%)と2022年以来最長の連敗を喫していたが、火曜は自律反発。市場予想は売上高約$920億・調整後EPS $2.09と前年比約97%増の過去最高を見込むが、直近6回のうち5回は決算後に株価が下落しており、焦点は3QガイダンスとBlackwellから次世代Vera Rubinへの製品移行の進捗に移っている。ほかにAlibabaが香港市場で過去最大となる$102億の新株発行を実施し、調達額の全額をフルスタックAI能力への投資に充てると表明した。||金利市場は完全な『ジャクソンホール待ち』の様相で、10年債利回りは約4.71%、DXYは週初に98.55と5月中旬以来の安値を付けた後99前後で膠着している。本日10:00ETに消費者信頼感・新築住宅販売・Case-Shiller住宅価格・リッチモンド連銀製造業が集中発表され、水曜にはPCEデフレーターが控える。市場は9月FOMCでの利上げを約3分の1織り込んでおり、8/28のウォーシュ議長就任後初の基調講演のトーンが最大の分岐点。対する日銀では、足達誠司・元審議委員が『9月利上げの地ならしは整った』と述べ、据え置きは円売り再燃と輸入インフレ加速のリスクを高めると警告。9/18会合での25bp利上げは約80%織り込まれ、10年JGBは約2.89%と多年ぶり高水準圏を維持している。||プライベートクレジット市場では、Eagle Point CreditがAnthropicを主要テナントとするテキサス州のAIデータセンター(総額$160億のプロジェクトファイナンス)に$13億のメザニン融資を実行。資金調達サイドではBCREDが$7.5億(当初約$5億)、Blue Owl Technology Financeが$4億(当初$2億超)といずれも増額して投資適格債を発行し、BDC債への需要の底堅さを示した。一方でノントレーデッドBDCの募集額は2Qに$20億と前年同期比82%減まで急減しており、業界はダイレクトレンディングから資産担保型融資への大きなピボットを迫られている。||日本市場では、Nikkei225が+0.31%の65,729円で取引を終了。M&A市場ではKakaku.com争奪戦が8/27のTOB期限を目前に最終局面を迎え、物言う株主Oasis Managementが『¥3,640未満では応募しない』と明言したことで、EQTの¥3,570をさらに引き上げるかが焦点となっている。中堅ではベインキャピタルと組んだボードルア(4413)のMBOが8/19に開始されたが、TOB価格¥2,970のプレミアムはわずか0.95%と実質ゼロに近く、少数株主保護の論点を残す。2026年上期のPEファンド関与の国内M&Aは約4.2兆円と前年比約4割増の活況だが、日銀の利上げによるLBO調達コスト上昇が加われば投資規律が試される局面に入る。今週の焦点は①Nvidia決算とPCEデフレーター、②8/28ウォーシュ議長講演、③Kakaku.com争奪戦の決着、の3点に集約される。",
    peTraining: {
      interviewQA: [
        { q: "Dick's Sporting Goodsのように『中核事業は好調(既存店+4.9%)なのに買収先の不振で通期見通しを大幅下方修正する』ケースを、投資家はどう評価すべきですか", a: "評価の要点は3つあります。①二つの事業を分けて見る:中核のDICK'S事業の既存店+4.9%は、同社のブランド力・実行力が損なわれていないことを示す重要な事実です。株価の15%下落が『会社全体の収益力の毀損』を織り込んだものなのか、『買収に伴う一時的な統合コスト・希薄化』を織り込んだものなのかで、投資判断は180度変わります。②希薄化の性質を見極める:Foot Lockerの不振が、統合作業に伴う一時的な混乱(在庫整理・システム統合)なのか、それとも構造的な需要低下・販促競争の激化という業界全体の問題なのかが最大の論点です。今回はスタック会長が『市場の一部で販促色が強まった』と業界要因に言及し、Nike・Academy Sportsにも売りが波及したことから、後者の色彩が濃いと市場は判断しました。③下方修正の幅を読む:通期EPS見通しが$14.20から$11.00〜12.00へと20〜23%も引き下げられたのは、経営陣が保守的なリセットを行った(いわゆる『キッチンシンク』)可能性も含みます。今後の四半期で上振れ余地を残す下方修正なのか、さらなる悪化の始まりなのかを、次の1〜2四半期の既存店動向で検証する姿勢が必要です。" },
        { q: "プライベートクレジット業界が『ダイレクトレンディングから資産担保型融資(ABF)へピボットしている』とは、具体的に何が変わるということですか。投資家が注視すべきリスクは何ですか", a: "従来のダイレクトレンディングは、中堅企業のキャッシュフロー(EBITDA)を返済原資とし、企業の事業継続性を審査する『企業与信』が中心でした。これに対し資産担保型融資(ABF)は、航空機リース債権・住宅ローン・設備リース・ロイヤリティ収入といった特定の資産が生み出すキャッシュフローを返済原資とし、担保資産の価値と回収可能性を審査する『資産与信』です。ピボットの背景には、①ダイレクトレンディングのスプレッドがレバレッジドローン対比で100bps未満(2017-18年は300bps超)まで圧縮し収益性が低下したこと、②ノントレーデッドBDCの募集額が前年比82%減と、リテール資金の流入が急減したことがあります。投資家が注視すべきリスクは主に2点です。第一に『能力の転用リスク』で、企業与信の審査能力に長けた運用会社が、性質の異なる資産与信でも同等の判断力を発揮できる保証はありません。第二に『評価の不透明性』で、ABFの担保資産は流動性が低くマーク・トゥ・マーケットが困難なものが多く、ポートフォリオの実態価値が悪化しても表面化するまでに時間がかかります。ピボット自体は合理的な戦略判断ですが、この移行期に積み上がった与信の品質が、今後数年の業界パフォーマンスを規定することになります。" },
        { q: "ボードルアのMBOはTOBプレミアムが0.95%とほぼゼロでした。プレミアムが低いこと自体は必ずしも不当とは限らないと言われますが、それはなぜですか。また少数株主はどこを見るべきですか", a: "プレミアムは『TOB価格 ÷ 公表前日終値 - 1』で計算されるため、分母である公表前日の株価が既にMBO観測を織り込んで上昇していれば、プレミアムは機械的に小さくなります。ボードルアのケースでは公表前に株価が4日続伸しており、情報が事前に一部で織り込まれていた可能性が示唆されます。この場合、直前終値との比較は買収価格の妥当性を測る指標として機能しません。そのため実務では、①1カ月・3カ月・6カ月の出来高加重平均株価(VWAP)に対するプレミアム、②第三者算定機関によるDCF法・類似会社比較法のレンジのどこに位置するか、③独立した特別委員会がどの程度実質的に価格交渉に関与したか、④マジョリティ・オブ・マイノリティ条項(支配株主を除く少数株主の過半数の応募)の有無、といった複数の観点から総合的に検証します。少数株主が最も重視すべきは、単一のプレミアム数値ではなく、価格算定プロセス全体の独立性と透明性です。Kakaku.comのケースでOasis Managementが『¥3,640未満では応募しない』と明示的な水準を提示したのは、まさにこの価格発見プロセスに市場参加者として能動的に関与する行動であり、日本のM&A実務における少数株主の交渉力を高める先例となりつつあります。" }
      ],
      keyConceptToday: {
        term: "資産担保型融資(ABF: Asset-Based Finance)へのピボット",

        { title:"Eagle Point、Anthropic向けテキサスDC $13億メザニンの全体像が判明 — Morgan Stanleyが約$160億パッケージを主導、シニア債務はGoogleが保証", tag:"デジタルインフラ融資", tagCls:"t-blue", meta:"Eagle Point Credit / Nexus Data Centers ｜ メザニン $1.3B ｜ 全体 約$16B ｜ シニア保証：Google", body:"開発会社Nexus Data Centersがテキサス州ハバードで進める2,900エーカーのAIデータセンター向けファイナンス。Eagle Point Credit Managementが約$13億のメザニンデットにおける最大の投資家となり、同トランシェは資本構造上シニア部分の下に位置する。全体の約$160億のプロジェクトファイナンスはMorgan Stanleyを含む銀行団が主導し、シニア債務についてはGoogleが保証を提供する構造。Eagle Pointは2025年9月頃からNexus向けファイナンスの組成に着手し、その後大幅に規模を拡大させてきた。キャンパスは自家発電用ガス火力発電所を併設し、Anthropicが主要テナントとなる。", sig:"『投資適格の第三者がシニアを保証し、メザニンを高利回り勢が取る』という新標準構造", sourceUrl:"https://www.privateequitywire.co.uk/eagle-point-leads-1-3bn-private-credit-loan-for-anthropic-linked-texas-data-centre/" },
        { title:"Jefferies Credit Partners、€10億(約$11.6億)のプライベートクレジット・セカンダリーファンドを組成 — 自己組成ローンを移すコンティニュエーション型", tag:"セカンダリー", tagCls:"t-green", meta:"Jefferies Credit Partners ｜ 目標€1B(エクイティ€500M＋レバレッジ€500M) ｜ ステープル型CV", body:"Jefferies Credit Partnersが、プライベートクレジットのセカンダリー市場投資家から約€10億の調達を目指している。コンティニュエーション・ビークル(ステープル取引)として組成され、自らが過去に組成した既存ポートフォリオのローンを買い取ると同時に、新規融資にも資金を振り向ける設計。内訳は投資家エクイティ約€5億とレバレッジ約€5億。Jefferiesが助言した案件ベースでは、クレジット・セカンダリーの取引額は2023年$60億→2024年$100億→2025年$170億超と急拡大しており、2026年は約$280億、2030年には$500億超に達すると見込まれている。", sig:"『出口のない資産クラス』という批判に対する業界側の制度的回答", sourceUrl:"https://finance.yahoo.com/markets/stocks/articles/jefferies-credit-partners-moving-own-204038976.html" },
        { title:"プライベートクレジット運用会社のM&Aが2026年に入り月次ペースで継続 — 逆風下でこそ規模と地理的カバレッジの追求が加速", tag:"業界再編", tagCls:"t-orange", meta:"CVC/Marathon $1.2B ｜ Nuveen/Schroders £9.9B ｜ Lazard/Campbell Lutyens $575M ｜ Bridgepoint/Kayne Anderson RE 約$1.4B", body:"2026年のプライベートクレジット業界では運用会社レベルの統合が途切れず続いている。1月にCVCが$12億でMarathonを買収しCVC Creditのフィー対象AUMを約€610億へ拡大、2月にはNuveenが£99億でSchrodersを取得し合計AUM約$2.5兆・プライベート市場$4,140億の陣容を構築。3月にSun LifeがCrescent Capitalの残り49%をC$8.29億で取得して$500億規模の運用会社を完全子会社化、4月にLazardが$5.75億でCampbell Lutyensを買収、6月にBridgepointが約$14億でKayne Anderson Real Estateを取得、7月にはPGIMがDeerpath Capitalの残り25%を取得した。リテール資金の流入急減という逆風下でも、あるいはそれゆえに、規模の経済と商品ラインの広さを求める動きが強まっている。", sig:"逆風局面ほど『中位運用会社の独立生存』が難しくなる", sourceUrl:"https://alternativecreditinvestor.com/2026/08/17/private-credit-consolidation-gathers-pace-in-2026/" }
      ],
      outlook: "💡 Nexus案件で明らかになった『シニアをGoogleが保証し、その下のメザニンをEagle Pointのような高利回り志向のクレジット勢が取る』という構造は、AIデータセンター融資の実質的な標準形になりつつある。ここで投資家が冷静に見るべきは、リスクの本質が開発会社Nexusやテナントのアンソロピックではなく、保証を提供する投資適格の巨大テック企業に集約されている点であり、その分メザニンの利回りが本当に残余リスクに見合っているかは別途検証を要する。同時に、Jefferiesのセカンダリーファンド組成と運用会社M&Aの連鎖は、いずれも『流動性』と『規模』という、これまでプライベートクレジットの構造的弱点とされてきた二点への対応である。リテール資金流入が前年比8割減という環境で、業界は資産サイド(AIインフラへの集中)と負債・組織サイド(セカンダリー市場の整備、運用会社統合)の双方で作り替えが進んでおり、この移行を完走できるかどうかが今後2〜3年の勝敗を分ける。"

    jpCredit: {
      summary: "カカクコム争奪戦は明日8/27のTOB期限を迎える。19.5%を握るOasisが『¥3,640未満では応募しない』と明言しているのに対し、LINEヤフー・ベイン陣営はEQTのTOB不成立を織り込み、9月中旬に自ら公開買付けを実施する準備に入ったと報じられた(KDDIの協力が得られれば¥3,640、得られなければ¥3,520)。一方、中堅では創業家・経営陣主導の非公開化が続き、デジタルハーツHD(3676)は会長個人の資産管理会社Sandboxによる¥1,060(プレミアム40.8%)のTOBが9/24まで進行中、アールビバン(7523)の¥1,900の再MBOは8/25に買付期間を終えた。2026年上期のTOBは55件と前年比13件減ながら過去2番目の高水準で、うち15件(4分の1超)にファンドが関与している。",
      deals: [
        { title:"カカクコム、明日8/27にEQTのTOB期限 — LINEヤフー・ベイン陣営は『不成立』を前提に9月中旬の自前TOBを準備", tag:"バイアウト", tagCls:"t-purple", meta:"EQT ¥3,570(期限8/27) vs LINEヤフー・ベイン ¥3,640(KDDI協力時)/¥3,520 ｜ Oasis保有19.5%", body:"EQTは5月の買収提案以来2度の価格引き上げを行い現在¥3,570、買付期間を8/27まで延長している。これに対しLINEヤフー・ベインキャピタル陣営は、KDDIの協力が得られれば¥3,640、得られなければ¥3,520という対抗提案を提示。同陣営はEQTのTOBが不成立に終わる可能性を織り込み、その場合はKDDIと不応募契約を、Oasisと応募契約を結んだうえで9月中旬に自ら公開買付けを実施する計画とされる。カカクコム株の19.5%を保有するOasisは取締役会と特別委員会に対し、TOB価格をLINEヤフー陣営の上限超えまで引き上げるかEQT案への賛同を撤回するよう要求し、¥3,640未満では応募しない方針を明言している。", sig:"アクティビストの『不応募表明』が事実上の価格下限を形成し、対抗陣営の次の一手を規定した", sourceUrl:"https://www.nikkei.com/article/DGXZQOUC217SU0R20C26A8000000/" },
        { title:"デジタルハーツHD(3676)、会長の資産管理会社SandboxによるMBOが進行中 — TOB価格¥1,060、プレミアム40.8%、期限9/24", tag:"MBO", tagCls:"t-green", meta:"デジタルハーツHD ｜ ¥1,060/株 ｜ Sandbox(宮澤栄一代表取締役会長が全株保有) ｜ 買付期間 8/7〜9/24", body:"ソフトウェアテスト・デバッグ大手のデジタルハーツホールディングスが8/6にMBOを発表。同社代表取締役会長の宮澤栄一氏が全株式を保有するSandboxがTOBを実施する。買付価格¥1,060は公表前日8/6終値¥753に対して40.77%のプレミアムで、発表翌日はストップ高買い気配となった。買付予定数の下限は592万2,743株(所有割合26.56%)、非公開化を目的とするため上限は設定されていない。生成AIがデバッグ業務そのものを呑み込みかねない構造変化を前に、上場企業として四半期業績に縛られたまま事業モデルを作り替えることの難しさが、『先回り』のMBOにつながったとの見方が出ている。", sig:"AIによる本業ディスラプションを前提とした『防衛的MBO』という新しい動機", sourceUrl:"https://maonline.jp/news/20260806h" },
        { title:"アールビバン(7523)、¥1,900の再MBOが8/25に買付期間終了 — 決済開始は9/1", tag:"MBO", tagCls:"t-blue", meta:"アールビバン ｜ ¥1,900/株 ｜ 買付期間 7/13〜8/25(30営業日) ｜ 決済開始 9/1", body:"版画・絵画販売のアールビバンが7/10に発表したMBOの買付期間が8/25に終了した。買付価格は1株¥1,900、買付期間は7/13から8/25までの30営業日で、決済の開始は9/1を予定。成立すれば上場廃止となる。同社は過去にもMBOを試みており今回が『再MBO』にあたる点が特徴で、一度は上場維持を選んだ企業が改めて非公開化に踏み切る事例として、上場コストと事業モデルの再検討が中堅企業層に広く及んでいることを示している。", sig:"『再MBO』の増加は上場維持コスト対比の便益が中堅層で崩れつつある証左", sourceUrl:"https://maonline.jp/news/20260710h" }
      ],
      outlook: "💡 カカクコムは明日の期限で、①EQTが¥3,640超へ三度目の引き上げを行う、②¥3,570のまま強行して不成立となりLINEヤフー・ベイン陣営の9月TOBに舞台が移る、の二択に事実上絞られた。注目すべきは、対抗陣営が既に『不成立シナリオ』を前提とした具体的な手順(KDDIとの不応募契約、Oasisとの応募契約、9月中旬のTOB開始)を用意している点で、これはOasisの明示的な価格下限表明が価格発見だけでなく次のプロセス設計そのものを規定していることを意味する。日本のテイクプライベート市場全体では、2026年上期のTOBが55件と前年比では減少しつつ過去2番目の高水準を保ち、うち4分の1超にファンドが関与している。デジタルハーツHDのようにAIによる本業ディスラプションを先回りして非公開化を選ぶ動機や、アールビバンのような『再MBO』が出てきていることは、案件の駆動要因がガバナンス改革一辺倒から事業構造そのものの作り替えへと移りつつあることを示唆する。日銀の9月利上げでLBO調達コストが切り上がれば、この流れの中で価格規律がどこまで保てるかが次の論点になる。",
    },
    narrative: "水曜(8/26・EDT)の米国市場は、寄付き前に7月PCEデフレーターという最大の関門を通過した。総合PCEは前年比3.7%と市場予想3.6%を上回り、前月比も+0.2%(予想+0.1%)と上振れ。一方コアPCEは前年比3.3%・前月比+0.2%と予想通りで6月から横ばいだった。『総合は上振れ、コアは横ばい』という判定の分かれる内容で、株先物はDowが横ばい、S&P500が-0.1%、Nasdaq100が-0.4%とハイテク中心にじり安の反応。前日火曜はS&P500が+0.32%の7,677.28、Nasdaqが+0.66%の26,151.30、Dowが+0.30%の53,577.40と主要3指数が揃って上昇していた。||本日最大のイベントは引け後のNvidia 2Q決算で、市場予想は売上高約$920億・調整後EPS $2.09。今回問われているのは単純な数字の上振れではなく、ハイパースケーラーの巨額AI設備投資が実際にリターンを生んでいるかという点である。新たな注目材料として、ネットワーキング部門が四半期$30億規模から約$170億規模へ拡大しGPU本体の成長率を上回る可能性が指摘されており、AIデータセンターの『接続』が第二の収益柱になりつつあるかが検証される。同日引け後にはSalesforce・CrowdStrike・Okta・Synopsysも決算を発表する。||コモディティ市場では原油の急落が続き、WTIは-1.5%の$80.46と$80割れ目前、Brentも-1.1%の$86.65と3営業日続落した。イランとオマーンがホルムズ海峡に暫定的な航行回廊を共同設置し機雷除去を進める『段階的枠組み』を協議していると伝わり、カタール首相とイランのアラグチ外相も電話会談でこの構想を議論。米国の対イラン追加制裁が市場想定より緩やかだったことと、米在庫の予想外の積み増しが重なり、地政学プレミアムが急速に剥落している。原油安はインフレ懸念を和らげ、10年債利回りを20カ月ぶり高水準の4.75%から約4.64%へ押し下げた。||個別株ではAbercrombie & Fitchが2Q調整後EPS $4.17(予想$1.98)・売上$13億(予想$12.5億)と大幅サプライズ、通期EPS見通しも$10.20〜11.00から$13.10〜13.60へ引き上げ約12%高。ただし約$1億(1株$1.75相当)のIEEPA関税還付が含まれる点は割り引く必要がある。Oklo他の原子力関連は、オンタリオ州フォード首相による『カナダは米国向けの精製ウラン供給を止める用意をすべき』との発言でウラン現物価格が7カ月ぶり高値へ上昇したことを受けて一斉高。逆にIntuitは前日引け後のFY26 4Q決算で売上・通期見通しがともに未達となり時間外で一時15%安、Bath & Body Worksは2Q実績が予想超えながら3Q見通し未達で8%超下落した。||金利面では、8/27〜29のジャクソンホール会議、なかでも8/28のウォーシュ議長就任後初となる基調講演が最大の分岐点となる。市場は9月FOMCでの利上げを約3分の1織り込むが、6月会合ではFOMC参加者の約半数が2026年中の利上げを見込み、7月会合では地区連銀総裁3名が利上げを求めて反対票を投じるなど委員会内のタカ派圧力は明確に強い。議長自身は『長期的な構造問題を扱い短期ガイダンスは示さない』と予告しており、期待先行の相場が肩透かしを食う可能性もある。日銀側は9/18会合での25bp利上げ(1.00%→1.25%)の織り込みが約82%と7月会合前の約23%から急上昇し、明日8/27の氷見野副総裁講演と8/28の東京都区部CPIが最終確認材料。ドル円は¥158.9と円がやや強含んでいる。||プライベートクレジット市場では、Eagle Pointによるテキサス州AIデータセンター向け$13億メザニンの全体像が判明し、総額約$160億のパッケージをMorgan Stanley主導の銀行団が組成し、シニア債務にはGoogleが保証を提供する構造であることが明らかになった。『投資適格の第三者がシニアを保証し、その下のメザニンを高利回り勢が取る』という形はAIデータセンター融資の標準形になりつつある。加えてJefferies Credit Partnersがコンティニュエーション・ビークル型の€10億セカンダリーファンドを組成し(エクイティ€5億＋レバレッジ€5億)、自己組成ローンの流動化に乗り出したほか、運用会社レベルでもCVC/Marathon、Nuveen/Schroders、Lazard/Campbell Lutyensなど2026年に入って月次ペースでM&Aが続いている。||日本市場ではNikkei225が+0.62%の66,262.16円と上昇。M&Aではカカクコム争奪戦が明日8/27のEQTのTOB期限で山場を迎え、19.5%を保有するOasisが『¥3,640未満では応募しない』と明言する中、LINEヤフー・ベイン陣営はEQT案の不成立を前提に9月中旬の自前TOB(KDDI協力時¥3,640、非協力時¥3,520)を準備していると報じられた。中堅ではデジタルハーツHD(3676)の会長個人資産管理会社Sandboxによる¥1,060(プレミアム40.8%)のMBOが9/24まで進行中で、生成AIによる本業ディスラプションを先回りする『防衛的MBO』との見方が出ている。アールビバン(7523)の¥1,900の再MBOは8/25に買付期間を終え9/1に決済開始。2026年上期のTOBは55件と前年比13件減ながら過去2番目の高水準を維持し、うち15件にファンドが関与した。本日以降の焦点は①Nvidia決算、②8/28ウォーシュ議長講演、③8/27カカクコムTOB期限と8/27氷見野副総裁講演、の3点に集約される。",
    peTraining: {
      interviewQA: [
        { q: "Eagle PointのAnthropic向けデータセンター案件では、シニア債務にGoogleが保証を提供しています。この構造は投資家にとって何を意味し、メザニン投資家はどこにリスクを取っていることになりますか", a: "この構造の本質は『信用リスクの付け替え』です。通常のプロジェクトファイナンスであれば、返済原資はデータセンターが生み出すキャッシュフロー、すなわちテナント(この場合Anthropic)の支払い能力と開発会社Nexusの建設・運営遂行力に依存します。ところがシニア債務にGoogleという投資適格の巨大テック企業が保証を付けると、シニア部分の実質的な信用リスクはプロジェクト固有のリスクからGoogleの信用力へと置き換わります。結果としてシニアは極めて低いスプレッドで調達でき、パッケージ全体の平均調達コストが下がる。ではメザニン投資家であるEagle Pointは何にリスクを取っているのか。ここが重要で、①保証はシニアにしか及ばないため、メザニンはプロジェクト固有リスク(建設遅延、コスト超過、テナントの契約更改条件の悪化、ガス火力発電所の稼働リスク)を丸ごと引き受けている、②資本構造上シニアの下・エクイティの上に位置するため、キャッシュフローが計画を下回れば真っ先に損失を吸収する、③開発実績のないNexusにとって初の開発案件であり、建設リスクの実績データが存在しない、という三重の集中リスクを負っています。したがって投資判断の核心は『メザニンの利回りが、シニアから切り離された残余リスクに見合っているか』であり、パッケージ全体の名目的な安全性に安心してはいけません。むしろシニアに保証が必要だったという事実自体が、プロジェクト単独の信用力では投資適格の調達が難しかったことを示すシグナルとして読むべきです。" },
        { q: "Jefferiesがコンティニュエーション・ビークル型のプライベートクレジット・セカンダリーファンドを組成しました。なぜ今こうしたファンドが増えているのか、また利益相反の観点でどこを検証すべきですか", a: "背景には、プライベートクレジットの構造的弱点である『流動性の欠如』への対応があります。ダイレクトレンディングのローンは相対で組成され取引市場がないため、LPが資金を回収するには満期を待つか、運用会社が売却先を見つけるしかありませんでした。ノントレーデッドBDCの募集額が前年比8割超減という環境では、新規資金でLPの解約に応じる従来の循環が機能しにくくなり、既存資産を流動化する仕組みの整備が急務になっています。Jefferiesが助言した案件ベースで、クレジット・セカンダリーの取引額が2023年$60億から2026年見込み約$280億へ4倍以上に膨らんでいるのはこの需要を反映しています。ただしコンティニュエーション・ビークル(ステープル取引)には構造的な利益相反があります。買い手側ファンドの運用者と、売り手側ポートフォリオの運用者が同一だからです。検証すべき論点は主に4つ。①価格決定の独立性 — 移管するローンの評価を第三者が独立に行ったか、それとも運用会社の内部評価に依存しているか。②逆選択の有無 — 移管された資産がポートフォリオの中で相対的に質の劣るもの、あるいは満期が近く問題が顕在化しつつあるものに偏っていないか。③既存LPの選択権 — 既存LPが現金化(売却)と継続(ロールオーバー)を実質的に選べる設計になっているか、事実上どちらかに誘導されていないか。④手数料の二重取り — 同じ資産に対して新旧両ファンドで管理報酬・成功報酬が発生する構造になっていないか。これらが担保されていれば正当な流動性提供手段ですが、担保されていなければ『問題資産を新しい投資家に付け替える装置』になり得ます。" },
        { q: "デジタルハーツHDのMBOは『生成AIが本業を呑み込む前の先回り』と評されています。ディスラプション対応を動機とする非公開化を、PE投資家としてどう評価すべきですか", a: "評価軸は『非公開化がディスラプション対応の必要条件になっているか』という一点に尽きます。同社はソフトウェアのテスト・デバッグを人手で行うビジネスモデルであり、生成AIがコード生成と同時にテストまで自動化すれば、既存の収益構造そのものが縮小に向かいます。ここで上場企業として四半期ごとに業績を説明しながら事業モデルを根本的に作り替えるのは極めて困難です。人員構成の転換、AI基盤への大型投資、既存顧客の一時的な喪失といった施策はいずれも短期の利益を大きく毀損するため、市場からの圧力下では実行しきれない。この意味で非公開化は合理的な選択と言えます。ただしPE投資家として厳しく見るべき点も三つあります。第一に『時間を買っただけで打ち手がない』リスクで、非公開化はあくまで変革を実行する環境を整えるだけであり、AI時代における具体的な差別化要因(たとえば蓄積したテストデータ資産、業界特有のドメイン知識、顧客との深い統合)が実在するかを検証しなければなりません。第二に価格の妥当性で、プレミアム40.8%という数字自体は良好に見えますが、ディスラプションによる将来キャッシュフローの逓減を織り込んだうえでなお少数株主にとって公正かは別問題です。むしろ将来の下落を織り込んだ株価にプレミアムを乗せているのだとすれば、経営陣が情報優位を持つ状況での買収という利益相反の論点が強まります。第三に、今回は経営陣自身の資産管理会社が買い手でありPEファンドが関与していない点で、外部の目による価格検証が働きにくい構造になっています。特別委員会の実質的な機能と第三者算定機関のレンジ内での位置づけを確認することが不可欠です。" }

      outlook: "💡 今日の米指標は『インフレも雇用も冷えていない』という一点で一貫しており、9月利上げの根拠を静かに積み増した。注目すべきは、それでもなお市場の織り込みが3分の1〜4割にとどまり、VIXが15.1と低位で安定している点で、これは『利上げがあってもリスク資産は壊れない』という前提が広く共有されていることを意味する。この前提が最も脆いのは、ウォーシュ議長が短期ガイダンスを避けたまま中立金利の水準そのものを高く見積もる構造論を展開した場合で、その時は利上げ1回の話ではなく金利パスの水準全体が切り上がるため、株式のバリュエーション前提が直接影響を受ける。日本側は氷見野講演が『予告なし・警戒感あり』という最も無難な着地となり、9月利上げの織り込み9割は動かなかった。結果として日米ともに材料は明日のジャクソンホールへ集約され、ドル円¥159.44はその判定待ちの水準と読むべきである。プライベートクレジット側でも、Benefit Street PartnersのAnant Kumar氏が『フォワードカーブが示すより広い金利分布を前提に引受すべき』『水準ではなく金利のボラティリティ自体をリスクとして扱え』と警告しており、変動金利で貸し出す側の目線も既に単一シナリオから分布へ移っている。"

      summary: "カカクコム争奪戦は本日8/27の期限を前にEQTが再延長で応じた。新価格は¥3,571と従来から僅か¥1の引き上げで、これはTOB期間を延長する際に価格改定が必要という制度要件を満たすための最小限の措置であり、期限を9/10へ先送りして次の手を探る時間を買った形である。LINEヤフー・ベイン陣営は8/21に『追加提案は行わず静観する』と表明済みで、19.5%を保有するOasisは¥3,640未満では応募しないと明言しており、EQTは価格を上げずに時間だけを延ばした状態にある。一方、新規案件では中国・立訊精密工業(Luxshare)がコンタクトレンズのシード(7743)に¥795(プレミアム48.6%)のTOBを開始し、JPMC(3276)では¥2,250(プレミアム23.5%)のMBOが9/15まで進行中。海外戦略投資家、創業経営陣、PEファンドという三者が同時に日本の中堅上場企業を非公開化に向かわせている。",
      deals: [
        { title:"EQT、カカクコムTOBを9/10まで再延長 — 価格は¥3,570から¥1だけ引き上げて¥3,571、実質は『期間延長のための最小限の値上げ』", tag:"バイアウト", tagCls:"t-purple", meta:"EQT ¥3,571(期限9/10へ延長) vs LINEヤフー・ベイン ¥3,640(KDDI協力時)/¥3,520 ｜ Oasis保有19.5%・下限¥3,640", body:"EQTは本日8/27が期限だったカカクコムへのTOBについて、買付期間を9/10まで延長し、買付価格を¥3,570から¥1引き上げて¥3,571にすると発表した。日本のTOB制度では買付期間を延長する際に価格改定が必要とされるため、¥1という金額は実質的な増額ではなく延長を成立させるための最小限の措置と読める。EQTは5月に¥3,000でTOBを開始して以来、対抗するLINEヤフー・ベインキャピタル連合との間で価格引き上げの応酬を続けてきた。対抗陣営はKDDIの協力が得られれば¥3,640、得られなければ¥3,520という条件付き提案を維持したまま、8/21に『追加提案は行わずEQT案の成否を静観する』と表明。香港のOasis Managementは19.5%を保有し、¥3,640を超えない限り応募しないと公言している。", sig:"『¥1の値上げ』は価格競争からの離脱ではなく、時間を買って構造を組み替える意思表示", sourceUrl:"https://www.nikkei.com/article/DGXZQOUB276UB0X20C26A8000000/" },
        { title:"中国・立訊精密工業(Luxshare)がシード(7743)に¥795でTOB — プレミアム48.6%、買付総額約123億円、東証スタンダードから上場廃止へ", tag:"クロスボーダー", tagCls:"t-blue", meta:"シード(7743) ｜ ¥795/株(前日終値比+48.6%) ｜ 買付者：ラックスシェア・プレシジョン・ケイマン ｜ 買付期間 8/27〜10/13 ｜ 下限 5,408,800株 ｜ 総額 約¥123.2億", body:"コンタクトレンズ国内大手のシードが8/26、中国の電子機器大手・立訊精密工業(Luxshare Precision)の子会社であるラックスシェア・プレシジョン・ケイマン・リミテッドによる公開買付けに賛同し、株主に応募を推奨すると発表した。買付価格は¥795で前日終値に対し48.6%のプレミアム、買付期間は8/27〜10/13、下限は5,408,800株で上限は設定されていない。買付総額は約123.2億円。取引成立後は買付者と筆頭株主の新井隆司氏のみが株主として残る非公開化を目指す設計で、スクイーズアウトを経て東証スタンダード市場から上場廃止となる予定。発表を受けてシード株はストップ高買い気配となり、TOB価格へのサヤ寄せが進んだ。", sig:"中国の製造大手が日本の医療機器ブランドを高プレミアムで取りに来る構図", sourceUrl:"https://maonline.jp/news/20260826d" },
        { title:"JPMC(3276)のMBOが9/15まで進行中 — 買付価格¥2,250、プレミアム23.5%、Amsterdam1・Amsterdam2が買付者", tag:"MBO", tagCls:"t-green", meta:"JPMC(3276) ｜ ¥2,250/株(8/3終値¥1,822比+23.5%) ｜ 買付者：Amsterdam1・Amsterdam2(Helsinki1・Helsinki2が議決権全部保有) ｜ 買付期間 8/4〜9/15 ｜ 代理人：野村證券", body:"賃貸住宅の一括借上げ(サブリース)事業を展開するJPMCが8/3にMBOを発表し、8/4から公開買付けが始まっている。買付者はHelsinki1・Helsinki2が議決権の全部を保有するAmsterdam1およびAmsterdam2の2社で、買付価格は1株¥2,250。8/3終値¥1,822に対して23.49%のプレミアムとなる。買付期間は9/15まで、公開買付代理人は野村證券。代表取締役社長の武藤英明氏は取引完了後も代表取締役として経営を継続する予定で、公開買付け成立後はスクイーズアウト手続を経て上場廃止となる。発表翌日の8/4はストップ高買い気配でTOB価格にサヤ寄せする動きとなった。", sig:"多層のSPV(Helsinki→Amsterdam)を挟む構造は典型的なファンド関与型MBOの形", sourceUrl:"https://kabukiso.com/apply/tob/2026/jpmc.html" }
      ],
      outlook: "💡 カカクコムの『¥1の値上げ』は、表面的には価格競争の終息に見えるが、実質は延長要件を満たすためだけの技術的措置であり、EQTが9/10までの2週間で何をするかがすべてである。取りうる選択肢は、①Oasisが示した¥3,640という下限を超える三度目の本格的な引き上げ、②KDDIの持分を巡る個別交渉で応募確度を確保する、③不成立を受け入れて撤退する、の三つに絞られる。対抗陣営が『静観』を宣言したことで価格競争の主導権はEQT側にあるように見えるが、実際にはOasisの不応募表明が動かない限りEQTは下限を満たせない構造であり、時間を延ばしても交渉相手は変わらない。他方、新規案件では性格の異なる買い手が同時に動いている点が今日の見どころである。シードは中国の製造大手による48.6%プレミアムのクロスボーダー買収、JPMCは多層SPVを介した経営陣主導のMBOで、いずれも中堅企業の非公開化という同じ結論に至りながら動機は全く異なる。2026年上期のTOB55件のうち15件にファンドが関与し、うち9件が海外ファンドだったという構成を踏まえると、日本のテイクプライベート市場は『誰が買い手か』の多様化局面に入っている。日銀の9月利上げが約9割織り込まれ、¥1.25%到達後のLBO調達コスト上昇が視野に入る中、この多様性が価格規律をどこまで維持できるかが次の論点になる。",
    },
    narrative: "水曜(8/26・EDT)の米国市場は、7月PCEデフレーターの上振れとNvidia決算待ちの重圧で主要3指数が揃って小幅安となった。S&P500は-0.02%の7,675.70、Nasdaqは-0.08%の26,130.20、Dowは-0.21%の53,463.88。ところが引け後の決算が地合いを一変させた。||Nvidiaは全項目で市場予想を上回った。FY27 2Qの売上は$962億(予想$919億、前年比+106%)、調整後EPSは$2.22(予想$2.08)、データセンター部門は$890億と前四半期比+18%、ネットワーキング部門も同じく+18%で四半期過去最高を記録した。粗利率は75%で横ばい。最も注目された3Q売上見通しは$1,080億±2%と市場予想$1,042億を$38億上回り、Vera Rubinの初回出荷が3Qに始まり4Qに量産が立ち上がることも確認された。Jensen Huang CEOは『エージェント型AIは人間主導の利用より15〜100倍の計算量を要する』と述べ、AIファクトリー全体をフルスタックで提供できる唯一の企業という立ち位置を強調している。加えてThe Informationが、Nvidiaがオープンソースモデル基盤Hugging Faceを$129億で買収することに合意したと報道。同社は2023年に評価額$45億のラウンドに参加し、昨年は評価額$70億での$5億出資を拒否されており、3年で評価額はほぼ3倍になった計算になる。ただしBusiness Insiderは『まだ合意には至っていない』と報じており、報道間で温度差がある点は留意が必要。||上振れはインフラ層にとどまらなかった。Salesforceは2Q調整後EPS $5.90・売上$113.5億(予想$113.2億)で、通期を$461〜464億へ増額。Anthropic株式の評価益$26億が効いて純利益は前年比87%増の$35.3億となり、AnthropicとのAI提携『Claudeforce』も発表して時間外+14%。CrowdStrikeは純新規ARR $3.33億と四半期過去最高、Oktaは調整後EPS $1.05(予想$0.97)で通期見通しを増額し時間外+19.4%と52週高値を更新した。AIエージェント需要がチップだけでなくアプリケーションとセキュリティの層にも実売上として降りてきていることが、三社同時の上振れで裏付けられた形である。寄り前はNasdaq100先物が+0.83%、S&P500先物が+0.31%と上昇する一方、Dow先物は-0.22%と、資金の偏りがはっきり出ている。||金利面では、新規失業保険申請が前週比4,000件減の20.3万件と予想20.8万件を下回り、継続受給者も177.8万件へ減少した。前日のPCE上振れ(総合3.7%、予想3.6%)と合わせ『インフレも雇用も冷えていない』構図が固まり、カンザスシティ連銀シュミッド総裁は『金利は非常に緩和的だ』、ボストン連銀コリンズ総裁は『インフレの持続的低下がデータで示されない限り早期に引き上げる必要がある』と発言。10年債利回りは約4.66%(+3bp)、DXYは99.1へ上昇した。ジャクソンホール会議は本日開幕し、ウォーシュ議長の就任後初となる基調講演は明日8/28午前10時(ET)。市場の9月利上げ織り込みは3分の1〜4割にとどまり、CNBC調査ではエコノミストの32%が『ややタカ派』を予想している。VIXが15.1と低位安定していることは、『利上げがあってもリスク資産は壊れない』という前提が広く共有されていることを示すが、議長が中立金利の水準観そのものを引き上げる構造論を展開すれば、この前提は一夜で崩れうる。||個別株では、Okta(+20.6%)、Salesforce(+10%)、Nvidia(+6%)が寄り前を牽引し、Micron(+4.1%)やIntel(+3.7%)など半導体にも波及。逆にWendy'sは、Nelson Peltz氏のTrian Fund Managementが現時点でのテイクプライベート提案を見送ったとRoyters報道を受けて-14%と急落した。株価水準・バリュエーション倍率・現行の戦略方向性への懸念が理由とされ、8/12の観測報道で+14.7%上昇し9カ月ぶり高値をつけた分をほぼ吐き出した。Canadian Solarは2Q売上$12.1億(前年比-29%)・GAAP EPS -$1.40と赤字が大幅に拡大し-10.2%。太陽光モジュール出荷が6割減で粗利率が29.8%から13.9%へ悪化し、蓄電池出荷+73%(3.7GWh)の健闘では補えなかった。||プライベートクレジット市場では、Victory CapitalがFirst Eagle Investmentsを$70億(現金$44億＋株式$20億)で買収することで合意。First EagleのAUM $2,220億を取り込み合算$5,710億となるが、狙いは同社が持つ$410億のCLO・オルタナティブクレジット基盤にある。伝統系の上場運用会社が上場株式を通貨としてクレジット運用能力を買いに来る形は、これまでのオルタナ同士の統合とは性格が異なる。ファンド組成側では、Citiからスピンアウトしたブリッジが米小売サプライヤー向けに$5億のダイレクトレンディングファンドを立ち上げ、確定注文を根拠に生産費用の最大100%を融資する運転資本特化型の設計を採用した。Partners GroupはベインによるGong cha買収に伴いプライベートクレジット投資をエグジットし、直前にアジア向け$10億のマンデートを獲得している。他方Benefit Street PartnersのAnant Kumar氏は『フォワードカーブが示すより広い金利分布を前提に引受すべき』『水準ではなくボラティリティ自体をリスクとして扱え』と警告しており、変動金利で貸す側の目線は既に単一シナリオから分布へ移りつつある。||日本市場ではNikkei225が-0.20%の66,131.98円と3日ぶりに反落。アドバンテストとファーストリテイリングの2銘柄で約309円分の押し下げ要因となった。日銀の氷見野副総裁はさいたま市の講演で『基調的な物価の上振れリスクに一段と注意が必要』としつつ、9月利上げを予告する表現は避け『毎会合でしっかり議論する』と述べるにとどめ、市場はほぼ無反応。9月利上げの織り込みは約9割で高止まりし、論点は既に1.25%到達後のペースと最終到達点(市場では1.5〜2.0%との見方)へ移っている。ドル円は¥159.44まで円安が進んだ。M&Aではカカクコム争奪戦でEQTが買付期間を9/10へ再延長し、価格を¥3,570から¥1だけ引き上げて¥3,571とした。延長には価格改定が必要という制度要件を満たすための最小限の措置であり、実質的な増額ではない。LINEヤフー・ベイン陣営は8/21に『追加提案せず静観』と表明済み、Oasisは19.5%を保有し¥3,640未満では応募しないと公言しており、EQTは価格を上げずに時間だけを延ばした状態にある。新規案件ではコンタクトレンズのシード(7743)に中国・立訊精密工業が¥795(プレミアム48.6%、総額約123億円)でTOBを開始し、JPMC(3276)では¥2,250(プレミアム23.5%)のMBOが9/15まで進行中。本日以降の焦点は①明日8/28のウォーシュ議長基調講演、②Nvidia決算後のAI関連の持続力、③カカクコムの9/10期限に向けたEQTの次の一手、の3点に集約される。",
    peTraining: {
      interviewQA: [
        { q: "EQTはカカクコムのTOB価格を¥3,570から¥1だけ引き上げて¥3,571とし、期間を9/10まで延長しました。この『¥1の値上げ』をどう読み解きますか。またEQTが取りうる選択肢を評価してください", a: "まず制度面の理解が出発点です。日本の公開買付制度では、買付期間を延長する際に買付条件の変更、実務上は価格の引き上げが必要とされます。したがって¥1という金額は経済的な意味を持つ増額ではなく、延長を法的に成立させるための最小単位の措置と読むべきです。つまりEQTは『価格では動かないが、撤退もしない』という中間的な立場を選び、9/10までの2週間を買ったことになります。次に、なぜ価格を上げないのかです。19.5%を保有するOasisが¥3,640未満では応募しないと公言している以上、EQTが下限を充足するには¥3,640超の提示が必要になる可能性が高い。ところが対抗陣営のLINEヤフー・ベインはKDDI協力時に¥3,640という条件付き提案を出したうえで8/21に『追加提案せず静観する』と宣言しており、EQTが¥3,640を超えた瞬間に対抗陣営が更に上乗せする自由度を保持しています。ここで安易に引き上げれば、勝者の呪い(winner's curse)を自ら招く構造になっている。したがってEQTの選択肢は実質三つです。①Oasisの下限を超える本格的な三度目の引き上げ — 取得価格が当初の¥3,000から2割以上切り上がり、日銀の9月利上げでLBO調達コストが上がる局面ではIRRの前提が崩れやすい。②KDDIとの個別交渉で応募確度を確保する — 価格を上げずに下限充足の道筋を作る唯一の手段で、¥1の延長はこの交渉時間を確保するための措置と解釈するのが最も整合的です。③不成立を受け入れて撤退する — サンクコストは大きいが、規律ある買い手としての評判は守れる。私が投資委員会にいるなら、②を主軸に、それが不調なら③を選ぶべきだと主張します。競合案件で価格の上限を破る誘惑に負けないことこそが、ファンドの長期的なディールフローを守るからです。" },
        { q: "Victory CapitalがFirst Eagleを$70億で買収しました。買収額の約3割を自社株で支払っている点、および狙いが$410億のCLO・オルタナティブクレジット基盤にある点を、どう評価しますか", a: "三つの層に分けて評価します。第一に対価構成です。$70億のうち現金$44億・株式$20億という構成は、買い手が上場企業であることを最大限に活用した設計です。上場株式を対価に使えるということは、①手元流動性やレバレッジを温存できる、②売り手側の経営陣・株主を統合後の企業価値にコミットさせられる、③統合が失敗した場合のダウンサイドを一部売り手と分担できる、という三つの利点があります。逆に言えば、非上場の運用会社は同じ規模の買収に対して現金かLBOローンで対価を用意するしかなく、資本コストで構造的に不利になる。これが『上場していること自体が買収通貨になる』という今回の本質で、非上場の中位運用会社にとっては独立生存の難易度が一段上がったことを意味します。第二に買収の中身です。狙いはFirst Eagleの$2,220億のAUM全体ではなく、そのうち$410億のCLO・オルタナティブクレジット・プラットフォームにあります。伝統的な株式・債券運用のフィー率が低下を続ける一方、CLO運用やダイレクトレンディングは相対的に高いフィー率とロックアップの効いた資金を持つため、AUM1ドルあたりの収益性が全く異なります。したがって検証すべきは合算AUM $5,710億という数字ではなく、そのフィー加重後の収益ミックスがどう変わるかです。第三に統合リスクです。First Eagleがブランドと運用の独立性を維持する設計になっている点は、キーパーソンの流出を防ぐという意味では合理的ですが、同時に『買ったが統合できない』リスクの裏返しでもあります。運用会社M&Aの価値の大半はディストリビューション統合とバックオフィスの規模の経済から出るため、運用側の独立性をどこまで保ちながらフロントとオペレーションを統合できるかが、ディールの成否を分けます。" },

<script>
// ── RENDER ENGINE ──
function fmtNum(v){
  if (typeof v !== 'number') return v;
  return v.toLocaleString('en-US', { maximumFractionDigits: 1 });
}
function dirClass(dir){ return dir === 'up' ? 'up' : dir === 'down' ? 'down' : 'flat'; }
function cClass(dir){ return dir==='up'?'c-up':dir==='down'?'c-down':'c-flat'; }
function macroValClass(dir){ return dir==='up'?'up':dir==='down'?'down':''; }
function arrow(dir){ return dir==='up'?'▲':dir==='down'?'▼':'‒'; }

function newsLink(item, isDeal){
  if(!item) return '';
  let url = item.sourceUrl;
  let label = '記事を読む →';
  if(!url && item.searchKey){
    url = 'https://www.google.com/search?q=' + encodeURIComponent(item.searchKey);
    label = '関連ニュースを見る';
  }
  if(!url) return '';
  const a = '<a class="' + (isDeal ? 'deal-link' : 'ev-link') + '" href="' + url + '" target="_blank" rel="noopener">' + label + '</a>';
  return isDeal ? '<div class="deal-links">' + a + '</div>' : a;
}

function sparkline(key){
  const end = currentIdx;
  const start = Math.max(0, end - 4); // last 5 trading days incl. today
  const pts = [];
  for(let i = start; i <= end; i++){
    const idx = MARKET_REPORTS[i] && MARKET_REPORTS[i].indices && MARKET_REPORTS[i].indices[key];
    if(idx && typeof idx.value === 'number') pts.push(idx.value);
  }
  if(pts.length < 2) return '';
  const w = 88, h = 26, pad = 3;
  const min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  const range = (max - min) || 1;
  const stepX = (w - pad * 2) / (pts.length - 1);
  const coords = pts.map(function(v, i){
    return [pad + i * stepX, pad + (h - pad * 2) * (1 - (v - min) / range)];
  });
  const path = coords.map(function(c, i){ return (i === 0 ? 'M' : 'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1); }).join(' ');
  const last = coords[coords.length - 1];
  const dotColor = pts[pts.length - 1] >= pts[0] ? '#10b981' : '#ef4444';
  return '<svg class="idx-spark" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" aria-hidden="true">' +
    '<path d="' + path + '" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="' + dotColor + '"/>' +
  '</svg>';
}

function renderIdxCard(idx, key){
  if(!idx) return '';
  const chg = (typeof idx.change === 'number') ? (idx.change>=0?'+':'') + fmtNum(idx.change) : idx.change;
  const pct = (typeof idx.pct === 'number') ? (idx.pct>=0?'+':'') + idx.pct.toFixed(2) + '%' : idx.pct;
  return '<div class="idx-card ' + dirClass(idx.dir) + '">' +
    '<div class="idx-name">' + idx.flag + ' ' + idx.name + '</div>' +
    '<div class="idx-val">' + fmtNum(idx.value) + '</div>' +
    '<div class="idx-chg ' + cClass(idx.dir) + '">' + arrow(idx.dir) + ' ' + chg + ' (' + pct + ')</div>' +
    sparkline(key) +
  '</div>';
}

function renderMacro(macro){
  if(!macro) return '';
  return Object.keys(macro).map(function(k){
    const v = macro[k];
    return '<div class="macro-item"><span class="macro-lbl">' + k + '</span>' +
      '<span class="macro-val ' + macroValClass(v.dir) + '">' + arrow(v.dir) + ' ' + v.value + '</span></div>';
  }).join('');
}

function moverRow(m){
  return '<div class="mover-row">' +
    '<div class="mover-ticker">' + m.ticker + '</div>' +
    '<div class="mover-info"><div class="mover-name">' + m.name + '</div><div class="mover-why">' + m.why + '</div></div>' +
    '<div class="mover-pct ' + m.dir + '">' + (m.pct>=0?'+':'') + m.pct.toFixed(1) + '%</div>' +
  '</div>';
}
function renderMoversLayout(movers){
  movers = movers || [];
  const ups = movers.filter(function(m){ return m.dir === 'up'; });
  const downs = movers.filter(function(m){ return m.dir === 'down'; });
  const upsHtml = ups.length ? ups.map(moverRow).join('') : '<div style="font-size:12px;color:#94a3b8">上昇銘柄なし</div>';
  const downsHtml = downs.length ? downs.map(moverRow).join('') : '<div style="font-size:12px;color:#94a3b8">下落銘柄なし</div>';
  return '<div>' + upsHtml + '</div><div>' + downsHtml + '</div>';
}

function renderEvents(events){
  events = events || [];
  if(!events.length) return '<div style="font-size:12px;color:#94a3b8">本日のイベントなし</div>';
  return events.map(function(e){
    return '<div class="ev-item"><div class="ev-title">' + e.icon + ' ' + e.title + '</div>' +
      '<div class="ev-detail">' + e.detail + '</div>' +
      newsLink(e, false) + '</div>';
  }).join('');
}

function renderDeal(d){
  return '<div class="deal">' +
    '<span class="deal-tag ' + d.tagCls + '">' + d.tag + '</span>' +
    '<div class="deal-ttl">' + d.title + '</div>' +
    '<div class="deal-meta">' + d.meta + '</div>' +
    '<div class="deal-body">' + d.body + '</div>' +
    '<div class="deal-sig">' + d.sig + '</div>' +
    newsLink(d, true) +
  '</div>';
}
function renderCreditBox(boxCls, flag, name, sub, data){
  if(!data) return '';
  const deals = data.deals || [];
  return '<div class="pc-box ' + boxCls + '">' +
    '<div class="pc-hdr"><span class="pc-flag">' + flag + '</span><span class="pc-name">' + name + '</span></div>' +
    '<div class="pc-sub">' + sub + '</div>' +
    '<div class="pc-summary">' + (data.summary || '') + '</div>' +
    '<div class="deals-grid">' + deals.map(renderDeal).join('') + '</div>' +
    '<div class="pc-outlook">' + (data.outlook || '') + '</div>' +
  '</div>';
}

function renderRateWatch(data){
  if(!data) return '';
  const items = data.items || [];
  const itemsHtml = items.map(function(it){
    return '<div class="ev-item"><div class="ev-title">' + it.icon + ' ' + it.title + '</div>' +
      '<div class="ev-detail">' + it.detail + '</div>' + newsLink(it, false) + '</div>';
  }).join('');
  return '<div class="pc-box rw-box">' +
    '<div class="pc-hdr"><span class="pc-flag">🏦</span><span class="pc-name">日米金利動向</span></div>' +
    '<div class="pc-sub">CPI・FRB・日銀・金利見通し</div>' +
    '<div class="pc-summary">' + (data.summary || '') + '</div>' +
    '<div class="events-list">' + itemsHtml + '</div>' +
    '<div class="pc-outlook">' + (data.outlook || '') + '</div>' +
  '</div>';
}

function renderNarrative(str){
  if(!str) return '<p style="color:#94a3b8">本日はナラティブ未生成</p>';
  return str.split('||').map(function(p){ return '<p>' + p.trim() + '</p>'; }).join('');
}

function renderPeTraining(pt){
  if(!pt) return '<div style="font-size:12px;color:#94a3b8">本日のPEトレーニングコンテンツなし</div>';
  const qaHtml = (pt.interviewQA || []).map(function(qa){
    return '<div class="qa-item"><div class="qa-q">' + qa.q + '</div><div class="qa-a">' + qa.a + '</div></div>';
  }).join('');
  const kc = pt.keyConceptToday || {};
  const da = pt.dealAnalysis || {};
  return '' +
    '<div class="pet-grid">' +
      '<div class="pet-card"><div class="pet-card-hdr">面接想定Q&amp;A</div>' + qaHtml + '</div>' +
      '<div class="pet-card"><div class="pet-card-hdr">今日の重要概念：' + (kc.term || '') + '</div>' +
        '<div class="concept-items">' +
          '<div class="concept-item"><div class="concept-lbl">定義</div><div class="concept-val">' + (kc.definition || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">背景</div><div class="concept-val">' + (kc.background || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">実務での使われ方</div><div class="concept-val">' + (kc.practical || '') + '</div></div>' +
          '<div class="concept-item"><div class="concept-lbl">2026年の文脈</div><div class="concept-val">' + (kc.context2026 || '') + '</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="pet-card" style="grid-column:1/-1"><div class="pet-card-hdr">ディール分析：' + (da.title || '') + '</div>' +
        '<div class="da-items">' +
          '<div class="da-item thesis"><div class="da-lbl">投資テーマ</div><div class="da-val">' + (da.thesis || '') + '</div></div>' +
          '<div class="da-item timing"><div class="da-lbl">なぜ今か</div><div class="da-val">' + (da.timing || '') + '</div></div>' +
          '<div class="da-item downside"><div class="da-lbl">ダウンサイド</div><div class="da-val">' + (da.downside || '') + '</div></div>' +
          '<div class="da-item valuation"><div class="da-lbl">バリュエーション</div><div class="da-val">' + (da.valuation || '') + '</div></div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

let currentIdx = MARKET_REPORTS.length - 1;

function dowLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return ['日','月','火','水','木','金','土'][d.getDay()];
}

function renderTabs(){
  const nav = document.getElementById('tab-nav-inner');
  nav.innerHTML = MARKET_REPORTS.map(function(r, i){
    return '<button class="tab-btn' + (i === currentIdx ? ' active' : '') + '" data-idx="' + i + '">' +
      r.dateLabel + '<span class="dow">' + dowLabel(r.date) + '</span></button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('.tab-btn'), function(btn){
    btn.addEventListener('click', function(){
      currentIdx = parseInt(btn.getAttribute('data-idx'), 10);
      renderAll();
    });
  });
}

function renderPanel(r){
  const idxCards = ['sp500','nasdaq','dow','nikkei'].map(function(k){ return renderIdxCard(r.indices[k], k); }).join('');
  return '' +
  '<div class="section"><div class="idx-grid">' + idxCards + '</div></div>' +
  '<div class="section"><div class="card"><div class="card-title">🌐 マクロ指標</div><div class="macro-grid">' + renderMacro(r.macro) + '</div></div></div>' +
  '<div class="section"><div class="sec-title">値動き銘柄</div>' +
    '<div class="movers-card"><div class="movers-layout">' + renderMoversLayout(r.movers) + '</div></div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">本日の注目イベント</div>' +
    '<div class="events-list">' + renderEvents(r.events) + '</div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">🏦 日米金利動向</div>' + renderRateWatch(r.rateWatch) + '</div>' +
  '<div class="section"><div class="sec-title">🇺🇸 US Private Credit</div>' +
    renderCreditBox('us-box', '🇺🇸', 'US Private Credit', 'ダイレクトレンディング・プライベートクレジット', r.usCredit) +
  '</div>' +
  '<div class="section"><div class="sec-title">🇯🇵 Japan PE / Private Credit</div>' +
    renderCreditBox('jp-box', '🇯🇵', 'Japan PE / Private Credit', 'バイアウト・TOB・メザニン', r.jpCredit) +
  '</div>' +
  '<div class="section"><div class="sec-title">本日のナラティブ</div>' +
    '<div class="narrative-box">' + renderNarrative(r.narrative) + '</div>' +
  '</div>' +
  '<div class="section"><div class="sec-title">PEトレーニング</div>' + renderPeTraining(r.peTraining) + '</div>';
}

function renderAll(){
  renderTabs();
  const r = MARKET_REPORTS[currentIdx];
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="report-panel active">' + renderPanel(r) + '</div>';
  const tokenInfo = document.getElementById('token-info');
  if(tokenInfo){
    const total = MARKET_REPORTS.reduce(function(s, x){ return s + (x.tokenEstimate || 0); }, 0);
    tokenInfo.textContent = '本日のトークン概算: ' + (r.tokenEstimate || 0).toLocaleString() + ' ｜ 累計: ' + total.toLocaleString();
  }
  document.title = '🇺🇸 US Market Morning Brief (' + r.dateLabel + ') | Private Credit Focus';
  const nav2 = document.getElementById('tab-nav-inner');
  const activeBtn = nav2.querySelector('.tab-btn.active');
  if(activeBtn && activeBtn.scrollIntoView){ activeBtn.scrollIntoView({ inline: 'center', block: 'nearest' }); }
}

renderAll();
</script>
</body>
</html>
